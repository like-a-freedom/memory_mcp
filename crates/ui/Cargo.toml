[package]
name = "ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "ui"
path = "src/main.rs"

[dependencies]
dioxus = { version = "=0.7.10", features = ["web"] }
dioxus-router = "=0.7.10"
# The renderer `dioxus` already resolves to; named here only so `main` can
# hand `WebHistory` an explicit runtime prefix via `Config::history` — the
# one native seam that keeps the router's URL space in step with the
# server-stamped base. Pin is exact and must keep matching what `dioxus`
# resolves to in `Cargo.lock` (same policy as the list below).
dioxus-web = "=0.7.10"
# Native Dioxus base-path source — the exact value `dioxus_web::WebHistory`
# prefixes router navigation with. Already in the lock file through
# `dioxus-web`; naming it here adds no crate to the graph (see the pin policy
# comment below).
dioxus-cli-config = { version = "=0.7.10", features = ["web"] }
serde = { workspace = true }
serde_json = { workspace = true }
# Browser APIs used directly by the UI. Keep the wasm-bindgen bindings aligned
# with Dioxus's resolved versions to avoid duplicate browser bindings.
gloo-net = { version = "=0.8.0", features = ["http"] }
gloo-timers = { version = "=0.4.1", features = ["futures"] }
js-sys = "=0.3.107"
wasm-bindgen-futures = "=0.4.80"
web-sys = { version = "=0.3.107", features = [
  "Clipboard",
  "Crypto",
  "Document",
  "Element",
  "Navigator",
  "Node",
  "Window",
] }

[lints]
workspace = true
