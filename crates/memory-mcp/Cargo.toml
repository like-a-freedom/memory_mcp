[package]
name = "memory_mcp"
version = "1.8.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anno.workspace = true
async-trait.workspace = true
axum = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
candle-core.workspace = true
candle-nn.workspace = true
candle-transformers.workspace = true
chacha20poly1305 = { workspace = true, optional = true }
chrono.workspace = true
clap.workspace = true
hex.workspace = true
hf-hub.workspace = true
hmac = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
indicatif.workspace = true
jsonwebtoken = { workspace = true, optional = true }
lopdf.workspace = true
lru.workspace = true
metrics.workspace = true
metrics-exporter-prometheus = { workspace = true, optional = true }
ndarray = "0.16"
oauth2 = { workspace = true, optional = true }
ort = { version = "=2.0.0-rc.12", features = ["ndarray"] }
mimalloc = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
regex.workspace = true
reqwest.workspace = true
rmcp.workspace = true
roxmltree.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
strsim.workspace = true
subtle = { workspace = true, optional = true }
surrealdb.workspace = true
thiserror.workspace = true
tokenizers.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tower-service = { workspace = true, optional = true }
unicode-normalization.workspace = true
uuid = { workspace = true, optional = true }
zip.workspace = true

[features]
default = []
# Optional Apple-specific CPU backend. Keep this out of `default`: Cargo package
# defaults are not target-aware, so portable consumers must opt in explicitly.
accelerate = ["candle-core/accelerate"]
fs-watch = ["dep:notify"]
mcp-apps = []
prometheus = ["dep:metrics-exporter-prometheus"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
mimalloc = ["dep:mimalloc"]
eval-support = []
# HTTP SaaS profile (ADR-0052). Off by default: existing stdio behavior and
# default build remain unchanged.
streamable-http = [
    "rmcp/transport-streamable-http-server",
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
    "dep:tower-service",
    "dep:http",
    "dep:http-body",
    "dep:http-body-util",
    "dep:bytes",
    "dep:uuid",
    "dep:rand",
    "dep:hmac",
    "dep:subtle",
]
control-plane = [
    "streamable-http",
    "dep:oauth2",
    "dep:jsonwebtoken",
    "dep:chacha20poly1305",
    "dep:base64",
]
control-plane-ui = ["control-plane"]
# Test-only: exposes #[cfg(any(test, feature = "test-fixtures"))] fixtures to
# integration tests in tests/. Declared so cfg references pass unexpected_cfgs.
test-fixtures = []

[[bin]]
name = "memory_mcp_http"
path = "src/bin/memory_mcp_http.rs"
required-features = ["streamable-http"]

[dev-dependencies]
csv.workspace = true
mockall.workspace = true
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
