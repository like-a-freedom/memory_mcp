[package]
name = "memory_mcp"
version = "1.15.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anno.workspace = true
async-trait.workspace = true
axum = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
candle-core.workspace = true
candle-nn.workspace = true
candle-transformers.workspace = true
chrono.workspace = true
chacha20poly1305 = { workspace = true, optional = true }
clap.workspace = true
hex.workspace = true
hf-hub.workspace = true
hmac = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
indicatif.workspace = true
jsonwebtoken = { workspace = true, optional = true }
lopdf.workspace = true
lru.workspace = true
metrics.workspace = true
metrics-exporter-prometheus = { workspace = true, optional = true }
argon2 = { version = "0.6", optional = true }
oauth2 = { workspace = true, optional = true }
ort = { version = "=2.0.0-rc.12", features = ["ndarray"] }
mimalloc = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
regex.workspace = true
reqwest.workspace = true
rmcp.workspace = true
roxmltree.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
strsim.workspace = true
subtle = { workspace = true, optional = true }
surrealdb.workspace = true
thiserror.workspace = true
tokenizers.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower-service = { workspace = true, optional = true }
unicode-normalization.workspace = true
uuid = { workspace = true, optional = true }
zip.workspace = true

[features]
default = ["fs-watch"]
# Optional Apple-specific CPU backend. Keep this out of `default`: Cargo package
# defaults are not target-aware, so portable consumers must opt in explicitly.
accelerate = ["candle-core/accelerate"]
fs-watch = ["dep:notify"]
# App-session surface (inspector / diff / graph / lifecycle MCP resources and
# tools). Orthogonal axis, usable in BOTH profiles: in-memory sessions in
# local/stdio, durable sessions persisted to the tenant namespace in HTTP.
mcp-apps = []
prometheus = ["dep:metrics-exporter-prometheus"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
mimalloc = ["dep:mimalloc"]
eval-support = []
# One coarse switch = the whole SaaS product (Streamable HTTP MCP data plane +
# control plane with OIDC/local-admin auth + embedded web UI + Prometheus).
# `control-plane`, `control-plane-ui` and `prometheus` are internal names implied
# by `streamable-http`; they exist only so the cfg sites in `http/` and `control/`
# keep compiling and are never written by users. App sessions stay a separate
# orthogonal axis (`mcp-apps`): in-memory in local/stdio, durable in HTTP.
streamable-http = [
    "control-plane",
    "control-plane-ui",
    "prometheus",
    "rmcp/transport-streamable-http-server",
    "dep:axum",
    "dep:http",
    "dep:http-body",
    "dep:http-body-util",
    "dep:bytes",
    "dep:tower-service",
    "dep:uuid",
    "dep:rand",
    "dep:hmac",
    "dep:subtle",
    "dep:base64",
]
# Internal: control-plane auth (OIDC + local admin). Mutually implies
# `streamable-http` (a benign feature cycle): `streamable-http` pulls in
# `control-plane` for the full SaaS product, and `control-plane` keeps a
# back-link so pre-existing test/operator invocations that name it without
# `streamable-http` still compile the `http` module they need.
control-plane = [
    "streamable-http",
    "dep:oauth2",
    "dep:jsonwebtoken",
    "dep:chacha20poly1305",
    "dep:hmac",
    "dep:uuid",
    "dep:rand",
    "dep:base64",
    "dep:argon2",
]
# Internal: embedded control-plane web UI bundle. Implied by `streamable-http`.
control-plane-ui = ["control-plane"]
# Test-only: exposes #[cfg(any(test, feature = "test-fixtures"))] fixtures to
# integration tests in tests/. Declared so cfg references pass unexpected_cfgs.
test-fixtures = []

[[bin]]
name = "memory_mcp_http"
path = "src/bin/memory_mcp_http.rs"
required-features = ["streamable-http"]

[dev-dependencies]
csv.workspace = true
mockall.workspace = true
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
