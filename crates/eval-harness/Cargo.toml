[package]
name = "eval-harness"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "eval_harness"
path = "src/lib.rs"

[[bin]]
name = "memory-eval"
path = "src/main.rs"

[dependencies]
memory_mcp = { path = "../memory-mcp", features = ["eval-support"] }
async-trait.workspace = true
chrono.workspace = true
clap.workspace = true
# Criterion is an optional dependency behind the `bench` feature: the four
# `[[bench]]` targets declare `required-features = ["bench"]`, so ordinary
# lint and test runs (`cargo clippy --all-targets`, `cargo test --workspace`)
# never compile the Criterion tree — it would otherwise build as an
# unconditional dev-dependency of every test target of this package.
# Weekly Extended evaluations compile, lint and run the benches with the
# feature enabled (see .github/workflows/evaluations.yml).
criterion = { workspace = true, optional = true }
csv.workspace = true
hex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
# Compile the Criterion benchmark targets of this package.
bench = ["dep:criterion"]

[lints]
workspace = true

[[bench]]
name = "pipeline"
harness = false
required-features = ["bench"]

[[bench]]
name = "ner_cpu"
harness = false
required-features = ["bench"]

[[bench]]
name = "ner_metal"
harness = false
required-features = ["bench"]

[[bench]]
name = "contention"
harness = false
required-features = ["bench"]
