[package]
name = "eval-harness"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "eval_harness"
path = "src/lib.rs"

[[bin]]
name = "memory-eval"
path = "src/main.rs"

[dependencies]
memory_mcp = { path = "../.." }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
serde_json = "1.0"
tempfile = "3"
