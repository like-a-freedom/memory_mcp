# Alerting rules for the memory_mcp HTTP profile.
#
# The method is the one the SRE Workbook's "Alerting on SLOs" chapter settles
# on, and it is worth saying why the obvious alternative is wrong.
#
# Alerting when the recent error rate exceeds the SLO looks right and is not.
# At a 99.9% SLO, alerting on a ten-minute error rate above 0.1% fires up to 144
# times a day, nearly all of them noise: a 0.1% error rate sustained for ten
# minutes consumes 0.000023% of a thirty-day budget — about one
# forty-thousandth of what there is to spend. An on-call engineer who learns
# that page is noise stops reading pages, and the one that mattered is the one
# they do not read.
#
# So these rules alert on **burn rate**: how fast the error budget is being
# spent relative to the rate that would exhaust it exactly at the end of the
# window. A burn rate of 1 is on pace to use the whole budget in thirty days;
# 14.4 exhausts a 30-day budget in a day. Each rule pairs a **long window**,
# which decides whether to fire at all, with a **short window**, which decides
# whether to stay fired. The short window is what makes the alert clear quickly
# instead of hanging for the length of the long one: a single-window alert at
# 14.4× keeps firing for over an hour after the incident is over, and an alert
# that stays on is an alert people learn to ignore.
#
# The Workbook's starting points, for a 99.9% SLO over 30 days:
#
#   page   14.4× burn,  1h long /  5m short —  2% of budget
#   page    6×   burn,  6h long / 30m short —  5% of budget
#   ticket  1×   burn,  3d long /  6h short — 10% of budget
#
# Every rule carries a `severity` label so routing is explicit rather than
# "everything to the same channel", and every rule points at the panel that
# answers the question it raised.
#
# The SLO is stated in the README beside this file. It is a number someone
# agreed to, not one this file derives: a burn rate is meaningless without the
# error budget it is a fraction of, and an SLO nobody negotiated is an SLO
# nobody defends.
#
# Verify with:
#
#   promtool check rules observability/alerts.yml

groups:
  # ─── Availability ───────────────────────────────────────────────────────────
  #
  # The SLO itself. If a service has one SLO it is this one, and everything
  # below is either a faster signal on the same thing or a different question.
  - name: memory-slo-availability
    interval: 30s
    rules:
      # 2% of the 30-day budget in an hour. Paged.
      #
      # Two windows, and they are genuinely different queries. The long one
      # decides whether the spend is real; the short one decides whether it is
      # still happening. Without the short one this fires on a spike and then
      # hangs for the length of the long window, and an alert that outlives its
      # incident is an alert people learn to wait out.
      #
      # Both ratios are computed from raw counters rather than from
      # `memory:http_requests:error_ratio5m`, because that recording rule
      # already has a five-minute window baked in — reusing it for the long
      # side would make a one-hour rule a five-minute one wearing a longer
      # name, which is the same mistake as naming a quantile `p95_15m` over a
      # one-minute window.
      - alert: HighErrorRate
        expr: |
          (
            (
              sum(rate(memory_http_requests_total{outcome="5xx"}[1h])) or vector(0)
            )
            /
            clamp_min(sum(rate(memory_http_requests_total[1h])) or vector(0), 0.001)
            > (14.4 * 0.001)
          )
          and
          (
            (
              sum(rate(memory_http_requests_total{outcome="5xx"}[5m])) or vector(0)
            )
            /
            clamp_min(sum(rate(memory_http_requests_total[5m])) or vector(0), 0.001)
            > (14.4 * 0.001)
          )
        for: 2m
        labels:
          severity: page
          slo: availability
        annotations:
          summary: Server errors are burning the availability budget 14× too fast
          description: >-
            2% of the 30-day error budget would be spent in an hour, and the
            spend is still under way over the last five minutes. The SLO is
            99.9% over 30 days; at this rate it is gone in about two days.
          dashboard: /d/memory_mcp-technical/traffic-and-errors
          runbook: docs/operations/LIMITATIONS.md

      # 5% of the budget in six hours. Paged, and the slower of the two page
      # rules: a burn that is under way but not yet urgent.
      - alert: SustainedErrorRate
        expr: |
          (
            (
              sum(rate(memory_http_requests_total{outcome="5xx"}[6h])) or vector(0)
            )
            /
            clamp_min(sum(rate(memory_http_requests_total[6h])) or vector(0), 0.001)
            > (6 * 0.001)
          )
          and
          (
            (
              sum(rate(memory_http_requests_total{outcome="5xx"}[30m])) or vector(0)
            )
            /
            clamp_min(sum(rate(memory_http_requests_total[30m])) or vector(0), 0.001)
            > (6 * 0.001)
          )
        for: 5m
        labels:
          severity: page
          slo: availability
        annotations:
          summary: Server errors are burning the availability budget 6× too fast
          description: >-
            5% of the 30-day error budget would be spent in six hours, and the
            spend continues over the last half hour.
          dashboard: /d/memory_mcp-technical/traffic-and-errors
          runbook: docs/operations/LIMITATIONS.md

      # 10% of the budget in three days. A ticket, not a page: the spend is
      # real and will have to be dealt with, but nothing is on fire and a person
      # can look at it during working hours.
      - alert: ErrorBudgetBurn
        expr: |
          (
            (
              sum(rate(memory_http_requests_total{outcome="5xx"}[3d])) or vector(0)
            )
            /
            clamp_min(sum(rate(memory_http_requests_total[3d])) or vector(0), 0.001)
            > 0.001
          )
          and
          (
            (
              sum(rate(memory_http_requests_total{outcome="5xx"}[6h])) or vector(0)
            )
            /
            clamp_min(sum(rate(memory_http_requests_total[6h])) or vector(0), 0.001)
            > 0.001
          )
        for: 30m
        labels:
          severity: ticket
          slo: availability
        annotations:
          summary: The service is spending its error budget faster than the SLO allows
          description: >-
            Sustained at or above the 99.9% SLO threshold: 10% of the 30-day
            budget is on track to be spent in three days. This is not an outage;
            it is a trend that will become one if nothing changes.
          dashboard: /d/memory_mcp-technical/overview-the-four-golden-signals
          runbook: docs/operations/LIMITATIONS.md

  # ─── Liveness ───────────────────────────────────────────────────────────────
  #
  # Two signals, because neither answers the other's question.
  #
  # `up` is generated by the collector, not the application, and it exists only
  # where the shipped scrape configuration (`observability/vmagent/vmagent.yml`
  # or `observability/prometheus.yml`) is in use — so it answers "can the
  # collector reach the service at all". The traffic counter answers "is
  # anything arriving", and it does so on every deployment with or without a
  # collector. A dead service reads zero on both; only `up` says which zero it
  # is, and only traffic exists where no collector was ever configured.
  - name: memory-liveness
    interval: 30s
    rules:
      # The scrape itself failed: the collector is up and the target did not
      # answer. It is a page because it is availability — every other signal
      # stops moving with it, and a blank dashboard looks exactly like an idle
      # service until someone opens this one.
      - alert: ScrapeTargetDown
        expr: |
          up{job="memory_mcp"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: The collector cannot scrape memory_mcp
          description: >-
            `up` for job `memory_mcp` has read 0 for two minutes, so the
            collector is running and the target did not answer: the process is
            down, the port is wrong, or the route between them is. Every panel
            downstream of the scrape goes empty with it, which is why this
            alert exists — without it a dead service and an idle one both read
            as silence. Absent rather than 0 means no scrape configuration is
            installed at all, which is `NoTraffic`'s territory, not this one's.
          dashboard: /d/memory_mcp-technical/collection-health

      - alert: NoTraffic
        expr: |
          (
            sum(rate(memory_http_requests_total[10m])) or vector(0)
          ) == 0
        for: 15m
        labels:
          severity: ticket
          note: unconditional
        annotations:
          summary: The service has served no requests for 15 minutes
          description: >-
            No HTTP traffic and no errors. Either the deployment is idle, which
            is fine, or it is not receiving traffic it should be, which is not.
            The error-ratio panels are empty in both cases, so this is the only
            signal that distinguishes them.
          dashboard: /d/memory_mcp-technical/overview-the-four-golden-signals

  # ─── Latency ────────────────────────────────────────────────────────────────
  #
  # Read from a recording rule over a five-minute window, which is the window
  # the exporter is configured to keep. The rule is on the whole service rather
  # than per route: a single slow route is a panel question, and paging about
  # one endpoint when the service as a whole answers quickly would be noise.
  - name: memory-latency
    interval: 30s
    rules:
      - alert: HighLatency
        expr: |
          memory:http_request_duration:p95_5m_total > 2
        for: 10m
        labels:
          severity: page
          slo: latency
        annotations:
          summary: p95 request latency has been above 2s for ten minutes
          description: >-
            The worst route's p95 is {{ $value | humanizeDuration }}. Two
            seconds is past the point where an interactive request feels broken
            to a person waiting on it. Which route is the cause is on the
            technical dashboard's latency row.
          dashboard: /d/memory_mcp-technical/http-latency
          runbook: docs/operations/LIMITATIONS.md

      - alert: LatencyDegraded
        expr: |
          memory:http_request_duration:p95_5m_total > 1
          and
          memory:http_request_duration:p95_5m_total <= 2
        for: 15m
        labels:
          severity: ticket
          slo: latency
        annotations:
          summary: p95 request latency has been above 1s for fifteen minutes
          description: >-
            Degrading rather than broken — the service is answering, and slowly.
            Worth a look before it becomes the page above.
          dashboard: /d/memory_mcp-technical/http-latency

  # ─── Lifecycle ──────────────────────────────────────────────────────────────
  #
  # Two questions about the recall-then-capture loop that no counter answers.
  #
  # Both are about knowledge that looks fine and is not: a service nobody calls
  # sees no error, so its failures are the kind that only a question can find.
  - name: memory-lifecycle
    interval: 30s
    rules:
      # Capture that never became knowledge.
      #
      # Both halves matter, and the first is what makes this a product signal
      # rather than a restatement of `NoIngestActivity`. That rule asks whether
      # anyone is calling ingest at all; this one asks whether the capture that
      # is arriving is *landing*, which is the failure ingest errors cannot
      # report — a door with nothing behind it counts as traffic. So the left
      # side is the traffic and the right side is the absence of learning, and a
      # deployment nobody is using fails the first and stays silent, which is
      # correct: an idle service is not a broken one.
      #
      # The traffic side counts both ways knowledge can arrive: MCP ingest and
      # extract calls, and watcher revisions that were stored. Without the
      # second half this alert is silently inert on a deployment whose knowledge
      # arrives from the inbox — the profile with the least supervision and the
      # most to lose from a capture loop that stopped.
      #
      # The stamp is absent until the first write, so a service that has never
      # learned anything produces no age and no alert here. That case is
      # `NoIngestActivity`'s, and it is a louder one.
      - alert: KnowledgeStale
        expr: |
          (
            (
              sum(rate(memory_operation_calls_total{operation=~"ingest|extract"}[2h]))
              or vector(0)
            )
            +
            (
              sum(rate(memory_fs_watch_revisions_total{outcome="processed"}[2h]))
              or vector(0)
            )
          ) > 0
          and on()
          (
            memory:knowledge:age_seconds > 21600
          )
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: Capture is being attempted, nothing new has been learned for six hours
          description: >-
            Ingest and extract calls have been arriving for two hours and the
            newest knowledge in the store is over six hours old, so the traffic
            is not turning into anything. This is the failure ingest errors
            cannot report: calls arrive, and what they should have written never
            appears. A deployment that is not meant to be ingesting will not
            reach this alert — with no capture traffic the left side is empty and
            it stays silent.
          dashboard: /d/memory_mcp-product/how-fresh-is-the-knowledge

      # Capture without recall: a write-only archive.
      #
      # Not a fault — a product finding, and the reason it is a ticket rather
      # than nothing. Knowledge is arriving and nobody is asking for it, which
      # means either the agents were pointed elsewhere, or the loop is broken in
      # a way no error reports: they capture, and the context they should have
      # recalled never comes back.
      #
      # The recall set is the same three operations the lifecycle recording
      # rules and the product dashboard count, so a deployment whose only recall
      # is `resolve` or `explain` is not a write-only archive. The left side
      # counts both ways knowledge arrives, MCP calls and stored watcher
      # revisions, so an inbox-fed archive is recognised as one. It is written
      # against the raw counters rather than the `…:rate15m_total` rules
      # because the windows here are a week and a day, and borrowing a
      # fifteen-minute rate to answer a week-long question would answer a
      # different one.
      #
      # `unless on()` rather than a `== 0` test with a `or vector(0)` guard,
      # because the case that matters most is the one with no recall series at
      # all: a deployment that has never been asked anything. A guard would
      # turn that absence into a zero and then compare it to zero, which is
      # how a rule ends up firing on every deployment the feature is off on.
      - alert: WriteOnlyArchive
        expr: |
          (
            (
              sum(rate(memory_operation_calls_total{operation=~"ingest|extract"}[7d]))
              or vector(0)
            )
            +
            (
              sum(rate(memory_fs_watch_revisions_total{outcome="processed"}[7d]))
              or vector(0)
            )
          ) > 0
          unless on()
          (
            sum(
              rate(memory_operation_calls_total{operation=~"assemble_context|explain|resolve"}[24h])
            ) > 0
          )
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: Knowledge is being captured but not read back
          description: >-
            Something has been ingesting this week and nothing has recalled in
            a day. The store is filling and no caller is using it — either the
            agents were pointed at a different service, or captures are
            succeeding while the recall path is quietly unreachable from where
            they run. A deployment that only captures deliberately (an archive,
            a batch importer) should silence this.
          dashboard: /d/memory_mcp-product/context-delivered

  # ─── Background work ────────────────────────────────────────────────────────
  #
  # Two rules, because these passes do not share a cadence and one threshold
  # cannot serve both ends of that. Lease renewal runs every second and
  # embedding recovery every minute; archival runs every *day* by default. A
  # single "two hours" budget would fire on the daily pass for all but two hours
  # of every day, which is an alert that cries wolf on a healthy deployment and
  # is therefore an alert nobody reads.
  - name: memory-background-work
    interval: 30s
    rules:
      # A frequent scheduler that stopped.
      #
      # The failure this catches emits nothing at all: no error, no refusal, no
      # latency, because nothing is running to produce any. A pass counter cannot
      # see it either — a scheduler running every minute and one that ran two
      # hours ago both report the same total — so the age is the only series that
      # can.
      #
      # Two hours against a one-second and a one-minute cadence is a wide margin
      # on purpose: this fires when a scheduler has missed a hundred rounds, not
      # when it was slow once.
      #
      # No `or vector(0)`, deliberately. A pass with no series has never run at
      # all, and "has never run" is a deployment's configuration rather than a
      # pass that went stale. It also means the first pass after a restart is
      # silent for up to one interval — the trade for not alerting on every
      # deployment where a scheduler is simply not enabled.
      - alert: SchedulerStalled
        expr: |
          memory:background_job:run_age_seconds{pass=~"task|lease|embedding_backfill"} > 7200
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: A frequently-scheduled background job has not run for two hours
          description: >-
            Lease renewal, durable tasks or embedding recovery last completed
            over two hours ago, against cadences of seconds and a minute. Nothing
            else reports this: the job is silent when it stops, its pass counter
            is unchanged rather than wrong, and no request is failing because
            nothing is being asked of it. Leases not renewed means requests
            eventually find their lease gone; durable tasks not drained means the
            work queue stops moving.
          dashboard: /d/memory_mcp-technical/helicopter-view-is-it-still-running

      # Maintenance that runs on a clock, judged against that clock.
      #
      # Decay defaults to hourly and archival to daily, so this budget is a day
      # and a quarter-hour: enough that a healthy daily pass never reaches it,
      # little enough that a maintenance pass dead for a day is an alert. A
      # deployment that set a longer archival interval should widen this rule
      # rather than silence it — the thing being reported is a promise the
      # product makes, quietly broken.
      - alert: MaintenanceNotRunning
        expr: |
          memory:background_job:run_age_seconds{pass=~"lifecycle_.*"} > 90000
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: A maintenance pass has not run in more than a day
          description: >-
            Archival or decay last completed over a day ago. Nothing else reports
            this, and nothing else would: the pass is silent when it stops, its
            counter is unchanged rather than wrong, and no request is failing
            because no request is involved. Archival not running means episodes
            accumulate forever and the retention policy is a claim; decay not
            running means superseded facts are never retired. Absent after a
            restart until the pass first runs — for a daily pass that is up to a
            day of silence, which is the honest cost of measuring the age from
            inside the process that has to run it.
          dashboard: /d/memory_mcp-technical/helicopter-view-is-it-still-running

  # ─── Ingestion ──────────────────────────────────────────────────────────────
  #
  # The product's own signals. An ingest that has stopped is invisible to a
  # user — nobody asked for anything, so nobody sees a failure — and knowledge
  # that stops accumulating is the failure nobody notices until they need it.
  - name: memory-ingestion
    interval: 30s
    rules:
      - alert: IngestFailureRate
        expr: |
          memory:operation_calls:error_ratio15m{operation="ingest"} > 0.1
        for: 10m
        labels:
          severity: page
        annotations:
          summary: More than 10% of ingest calls are failing
          description: >-
            Ingest is the door knowledge comes through. A tenth of it failing
            means a tenth of what was offered is being silently dropped, and the
            caller may not be retrying.
          dashboard: /d/memory_mcp-product/is-the-knowledge-any-good

      - alert: NoIngestActivity
        expr: |
          (
            sum(rate(memory_operation_calls_total{operation="ingest"}[2h])) or vector(0)
          ) == 0
        for: 30m
        labels:
          severity: ticket
          note: unconditional
        annotations:
          summary: No ingest calls for two hours
          description: >-
            Nothing has been ingested for two hours. A deployment that is not
            meant to be ingesting will alert on this and the alert should be
            silenced; a deployment that is will have quietly stopped learning.
          dashboard: /d/memory_mcp-product/what-people-are-doing

      # No `or vector(0)` anywhere in this rule, and that is the whole design.
      #
      # `or vector(0)` turns an absent series into a literal `0`, so
      # `… or vector(0) == 0` is `0 == 0` — true — and the alert fires on every
      # deployment where the feature is off. That is the worst shape an alert
      # can have: it is guaranteed to fire where there is nothing to report, and
      # it is silenced in exactly the deployment that should not need it.
      #
      # The two watcher alerts that used to sit here are gone rather than
      # guarded: filesystem ingestion is the stdio-only path, `MEMORY_INGESTION_INBOX`
      # is refused at startup in this profile, and the HTTP binary never wires a
      # watcher, so `memory_fs_watch_*` can never have a series here. An alert on
      # a family this profile cannot produce is not quiet — it is a rule nobody
      # can test and nobody should trust.

  # ─── Subsystems ─────────────────────────────────────────────────────────────
  - name: memory-subsystems
    interval: 30s
    rules:
      - alert: BackgroundJobsFailing
        expr: |
          memory:background_jobs:unhealthy_rate15m{pass="lease"} > 0
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: The lease scheduler has failed or degraded every pass for 15 minutes
          description: >-
            A lease that is neither taken nor released is a tenant runtime that
            is not being cleaned up. Nothing user-visible fails immediately;
            this accrues.
          dashboard: /d/memory_mcp-technical/background-jobs

      - alert: RuntimeRefusals
        expr: |
          sum(rate(memory_runtime_refusals_total[15m])) > 0.1
        for: 10m
        labels:
          severity: page
        annotations:
          summary: The HTTP runtime is refusing requests it cannot serve
          description: >-
            Quota, lease, task or registry failures, above 0.1 per second. These
            answer 5xx with a generic body, so the client is told nothing and a
            report from them carries only a request id.
          dashboard: /d/memory_mcp-technical/runtime-refusals

      - alert: RegistryInconsistent
        expr: |
          (
            sum(rate(memory_http_registry_reconciliation_total[30m])) or vector(0)
          ) > 0
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: Tenant namespaces are inconsistent with the registry
          description: >-
            Registered but unbound, or bound to nothing. Reconciliation runs at
            most once a minute, so a sustained rate means a standing
            inconsistency rather than a transient one — a tenant exists that
            cannot be served.
          dashboard: /d/memory_mcp-technical/runtime-refusals

      # Selected by `reason_code`, not by `outcome`. The outcome vocabulary is
      # the reconciliation outcomes — duplicate, supersession, correction,
      # contradiction, temporal_ambiguity — and anything else collapses to
      # `other`. There is no `outcome="error"`, so a rule selecting one matches
      # an empty vector and can never fire: the label value does not exist, and
      # nothing reports that a well-formed rule is dead. The reason a projection
      # failed is in `reason_code`, which is where the bounded error buckets are.
      - alert: ClaimProjectionFailing
        expr: |
          (
            sum(rate(memory_claim_pipeline_total{reason_code="internal"}[15m])) or vector(0)
          ) > 0
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: Claim projection is failing
          description: >-
            A post-fact projection step failed. Claims are the structured layer
            over facts, so this does not stop facts being stored — but the claim
            derived from a failing projection is missing, and the graph is
            quietly less complete than the facts it was built from.
          dashboard: /d/memory_mcp-technical/claims

  # ─── Access ─────────────────────────────────────────────────────────────────
  - name: memory-access
    interval: 30s
    rules:
      # Deliberately not a page. A closed sign-up policy refuses every
      # self-service attempt, correctly and indefinitely, and paging an operator
      # about a configured setting is how a page channel stops being read.
      - alert: SignupsRefused
        expr: |
          (
            sum(rate(memory_auth_refusals_total{branch="signup_invite_only"}[1h])) or vector(0)
          ) > 0
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: Sign-ups are being refused by the invite-only policy
          description: >-
            Expected on a deployment closed to self-service sign-up. Included
            because it is also what a *user* sees, and "nobody can sign up" is
            worth knowing about before they say so. If this is intentional,
            silence it — the branch is a configuration fact, not a fault.
          dashboard: /d/memory_mcp-technical/authentication
