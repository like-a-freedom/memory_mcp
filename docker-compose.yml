# memory_mcp — one runtime, one file.
#
#   docker compose up -d
#
# The browser authentication methods are a **runtime** choice, not a build or
# file choice (ADR-0057). `MEMORY_MCP_HTTP_AUTH_METHODS` is a comma-separated
# set drawn from `local` and `oidc`:
#
#   local        the administrator's password door, provisioned with
#                `memory_mcp admin create`. No external dependency, so it works
#                out of the box and stays available when a provider does not.
#   oidc         the identity-provider redirect for Accounts and operators.
#   local,oidc   both at once. This is the whole point: start with the local
#                administrator, add the provider later, and never re-provision
#                clients, rotate API keys or rebuild the image.
#
# The default is `local` because it is the only set that needs no external
# input. To add a provider, set `MEMORY_MCP_HTTP_AUTH_METHODS=local,oidc` and
# the two required values `MEMORY_MCP_HTTP_OIDC_ISSUER` and
# `MEMORY_MCP_HTTP_OIDC_CLIENT_ID`; everything else derives when unset (the
# secret slots also come from `MEMORY_MCP_HTTP_SECRET_KEY`). The server keeps
# serving the local door and adds the redirect beside it.
#
# To go the other way and drop the local door, the set alone is not enough:
# startup reconciliation is additive and refuses to narrow the stored set. Run
# `memory_mcp admin auth-methods remove --method local` once, with the target set
# and `MEMORY_MCP_HTTP_OPERATOR_IDENTITIES` already exported, then set
# `MEMORY_MCP_HTTP_AUTH_METHODS=oidc` and restart. The command refuses to remove
# `local` while no operator identity is configured, because that is how a
# deployment locks itself out of its own administration.
#
# Values the enabled methods need are validated by the server, which names the
# missing or forbidden variable and how to fix its set. `MEMORY_MCP_HTTP_
# AUTH_METHODS` replaces the removed `MEMORY_MCP_HTTP_AUTH_MODE`, which is still
# accepted for one release as a one-element set.
#
# Every `${VAR:-}` below is an empty default on purpose: an empty value is read
# as "not set", so a method's material must be supplied by the operator's
# environment rather than invented here.
#
# SECURITY: no secret is defaulted anywhere. Every `${VAR:?...}` must be
# supplied by the operator from a protected environment file; there are no
# example browser keys and no `root/root` database credentials.

services:
  surrealdb:
    image: surrealdb/surrealdb:v3.2.4
    platform: linux/amd64
    # Docker creates named volumes as root-owned. The official image defaults
    # to nonroot, so run this single stateful service as root to initialize and
    # maintain the mounted RocksDB directory.
    user: "0:0"
    command:
      - start
      - --user
      - "${SURREALDB_USERNAME:?SURREALDB_USERNAME is required; supply an operator-generated value}"
      - --pass
      - "${SURREALDB_PASSWORD:?SURREALDB_PASSWORD is required; supply an operator-generated value}"
      - rocksdb:/data/memory.db
    ports:
      - "8000:8000"
    volumes:
      - surrealdb-data:/data
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--endpoint", "http://127.0.0.1:8000"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  memory_mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${MEMORY_MCP_IMAGE:-memory-mcp-http:local}"
    platform: linux/amd64
    ports:
      - "8080:8080"
    depends_on:
      surrealdb:
        condition: service_healthy
    environment:
      # ── Non-secret shared settings ────────────────────────────────────
      MEMORY_MCP_HTTP_BIND: "0.0.0.0:8080"
      MEMORY_MCP_HTTP_PUBLIC_BASE_URL: "${MEMORY_MCP_HTTP_PUBLIC_BASE_URL:?MEMORY_MCP_HTTP_PUBLIC_BASE_URL is required (https://…, or a localhost development URL with an enabled local method)}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:?ALLOWED_HOSTS is required (comma-separated)}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required (comma-separated, no wildcard)}"
      MEMORY_MCP_HTTP_REPLICA_ID: "${MEMORY_MCP_HTTP_REPLICA_ID:-memory-http-1}"
      RUST_LOG: "${RUST_LOG:-info}"
      NER_EXTRACTOR: "${NER_EXTRACTOR:-anno}"
      EMBEDDINGS_ENABLED: "${EMBEDDINGS_ENABLED:-false}"

      # ── Operator-generated secrets (never defaulted) ──────────────────
      MEMORY_MCP_API_KEY_PEPPER: "${MEMORY_MCP_API_KEY_PEPPER:?MEMORY_MCP_API_KEY_PEPPER is required (>=32 bytes); supply an operator-generated value}"
      MEMORY_MCP_HTTP_SESSION_KEY: "${MEMORY_MCP_HTTP_SESSION_KEY:?MEMORY_MCP_HTTP_SESSION_KEY is required (64 hex chars); supply an operator-generated value}"
      MEMORY_MCP_HTTP_CSRF_KEY: "${MEMORY_MCP_HTTP_CSRF_KEY:?MEMORY_MCP_HTTP_CSRF_KEY is required (64 hex chars); supply an operator-generated value}"

      # ── Storage ───────────────────────────────────────────────────────
      SURREALDB_CONTROL_URL: ws://surrealdb:8000/rpc
      SURREALDB_CONTROL_USERNAME: "${SURREALDB_USERNAME:?SURREALDB_USERNAME is required; supply an operator-generated value}"
      SURREALDB_CONTROL_PASSWORD: "${SURREALDB_PASSWORD:?SURREALDB_PASSWORD is required; supply an operator-generated value}"
      SURREALDB_CONTROL_NAMESPACE: "${SURREALDB_CONTROL_NAMESPACE:-control}"
      SURREALDB_CONTROL_DB: "${SURREALDB_CONTROL_DB:-registry}"
      SURREALDB_TENANT_URL: ws://surrealdb:8000/rpc
      SURREALDB_TENANT_USERNAME: "${SURREALDB_USERNAME:?SURREALDB_USERNAME is required; supply an operator-generated value}"
      SURREALDB_TENANT_PASSWORD: "${SURREALDB_PASSWORD:?SURREALDB_PASSWORD is required; supply an operator-generated value}"
      SURREALDB_TENANT_NAMESPACE: "${SURREALDB_TENANT_NAMESPACE:-tenant}"
      SURREALDB_TENANT_DB: "${SURREALDB_TENANT_DB:-tenant}"

      # ── Browser surface ───────────────────────────────────────────────
      # Set the control plane to `false` for a data-plane-only deployment: no
      # browser or provider material is required at all in that case.
      MEMORY_MCP_HTTP_ENABLE_CONTROL_PLANE: "${MEMORY_MCP_HTTP_ENABLE_CONTROL_PLANE:-true}"
      MEMORY_MCP_HTTP_ENABLE_CONTROL_PLANE_UI: "${MEMORY_MCP_HTTP_ENABLE_CONTROL_PLANE_UI:-true}"
      MEMORY_MCP_HTTP_AUTH_METHODS: "${MEMORY_MCP_HTTP_AUTH_METHODS:-local}"
      MEMORY_MCP_HTTP_SIGNUP_MODE: "${MEMORY_MCP_HTTP_SIGNUP_MODE:-invite_only}"

      # ── `local`: the administrator door ───────────────────────────────
      # The plan this deployment publishes for the clients the administrator
      # provisions. They match `PlanLimits::default()`; set your own before
      # provisioning anything, because the server refuses a stored plan whose
      # limits have since drifted.
      MEMORY_MCP_HTTP_LOCAL_DEFAULT_PLAN_VERSION: "${MEMORY_MCP_HTTP_LOCAL_DEFAULT_PLAN_VERSION:-1}"
      MEMORY_MCP_HTTP_MAX_INGESTED_BYTES: "${MEMORY_MCP_HTTP_MAX_INGESTED_BYTES:-1073741824}"
      MEMORY_MCP_HTTP_MAX_EPISODE_COUNT: "${MEMORY_MCP_HTTP_MAX_EPISODE_COUNT:-100000}"
      MEMORY_MCP_HTTP_INGEST_PER_MINUTE: "${MEMORY_MCP_HTTP_INGEST_PER_MINUTE:-60}"
      MEMORY_MCP_HTTP_MAX_OPEN_APP_SESSIONS: "${MEMORY_MCP_HTTP_MAX_OPEN_APP_SESSIONS:-32}"
      MEMORY_MCP_HTTP_MAX_ACTIVE_API_KEYS: "${MEMORY_MCP_HTTP_MAX_ACTIVE_API_KEYS:-5}"
      MEMORY_MCP_HTTP_PER_TENANT_REQUEST_CONCURRENCY: "${MEMORY_MCP_HTTP_PER_TENANT_REQUEST_CONCURRENCY:-4}"
      MEMORY_MCP_HTTP_EXTRACTION_CONCURRENCY: "${MEMORY_MCP_HTTP_EXTRACTION_CONCURRENCY:-2}"

      # ── `oidc`: the identity provider ─────────────────────────────────
      # Unused unless `oidc` is in the set, and refused if it is not: a
      # provider that is configured but not enabled is a deployment that
      # believes it has SSO when it does not. The three keys below are
      # derived from the session key while `local` is the whole set.
      MEMORY_MCP_HTTP_OIDC_ISSUER: "${MEMORY_MCP_HTTP_OIDC_ISSUER:-}"
      MEMORY_MCP_HTTP_OIDC_CLIENT_ID: "${MEMORY_MCP_HTTP_OIDC_CLIENT_ID:-}"
      MEMORY_MCP_HTTP_OIDC_AUDIENCE: "${MEMORY_MCP_HTTP_OIDC_AUDIENCE:-}"
      MEMORY_MCP_HTTP_OIDC_REDIRECT_URI: "${MEMORY_MCP_HTTP_OIDC_REDIRECT_URI:-}"
      # Unset derives `auto` (the provider's advertised set intersected with
      # the safe set); an explicit value is a single-algorithm pin.
      MEMORY_MCP_HTTP_OIDC_ALLOWED_ALG: "${MEMORY_MCP_HTTP_OIDC_ALLOWED_ALG:-}"
      MEMORY_MCP_HTTP_OPERATOR_IDENTITIES: "${MEMORY_MCP_HTTP_OPERATOR_IDENTITIES:-}"
      MEMORY_MCP_HTTP_IDENTITY_INDEX_KEY: "${MEMORY_MCP_HTTP_IDENTITY_INDEX_KEY:-}"
      MEMORY_MCP_HTTP_OIDC_STATE_KEY: "${MEMORY_MCP_HTTP_OIDC_STATE_KEY:-}"
      MEMORY_MCP_HTTP_OIDC_NONCE_KEY: "${MEMORY_MCP_HTTP_OIDC_NONCE_KEY:-}"

volumes:
  surrealdb-data:
