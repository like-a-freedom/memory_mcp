services:
  surrealdb:
    image: surrealdb/surrealdb:v3.2.4
    platform: linux/amd64
    # Docker creates named volumes as root-owned. The official image defaults
    # to nonroot, so run this single stateful service as root to initialize and
    # maintain the mounted RocksDB directory.
    user: "0:0"
    command:
      - start
      - --user
      - "${SURREALDB_USERNAME:-root}"
      - --pass
      - "${SURREALDB_PASSWORD:-root}"
      - rocksdb:/data/memory.db
    ports:
      - "8000:8000"
    volumes:
      - surrealdb-data:/data
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--endpoint", "http://127.0.0.1:8000"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  memory_mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${MEMORY_MCP_IMAGE:-memory-mcp-http:local}"
    platform: linux/amd64
    ports:
      - "8080:8080"
    depends_on:
      surrealdb:
        condition: service_healthy
    environment:
      MEMORY_MCP_HTTP_BIND: "0.0.0.0:8080"
      MEMORY_MCP_HTTP_PUBLIC_BASE_URL: "${MEMORY_MCP_HTTP_PUBLIC_BASE_URL:-http://localhost:8080}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost:8080,127.0.0.1:8080}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:8080}"
      MEMORY_MCP_HTTP_REPLICA_ID: "${MEMORY_MCP_HTTP_REPLICA_ID:-memory-http-1}"
      MEMORY_MCP_HTTP_SIGNUP_MODE: "${MEMORY_MCP_HTTP_SIGNUP_MODE:-invite_only}"
      MEMORY_MCP_HTTP_ENABLE_CONTROL_PLANE: "${MEMORY_MCP_HTTP_ENABLE_CONTROL_PLANE:-false}"
      MEMORY_MCP_HTTP_ENABLE_CONTROL_PLANE_UI: "${MEMORY_MCP_HTTP_ENABLE_CONTROL_PLANE_UI:-false}"
      MEMORY_MCP_HTTP_AUTH_MODE: "${MEMORY_MCP_HTTP_AUTH_MODE:-}"
      MEMORY_MCP_HTTP_LOCAL_DEFAULT_PLAN_VERSION: "${MEMORY_MCP_HTTP_LOCAL_DEFAULT_PLAN_VERSION:-}"
      MEMORY_MCP_API_KEY_PEPPER: "${MEMORY_MCP_API_KEY_PEPPER:-local-development-pepper-change-me-0123456789}"
      MEMORY_MCP_HTTP_IDENTITY_INDEX_KEY: "${MEMORY_MCP_HTTP_IDENTITY_INDEX_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
      MEMORY_MCP_HTTP_SESSION_KEY: "${MEMORY_MCP_HTTP_SESSION_KEY:-1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef}"
      MEMORY_MCP_HTTP_OIDC_STATE_KEY: "${MEMORY_MCP_HTTP_OIDC_STATE_KEY:-abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789}"
      MEMORY_MCP_HTTP_OIDC_NONCE_KEY: "${MEMORY_MCP_HTTP_OIDC_NONCE_KEY:-fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210}"
      MEMORY_MCP_HTTP_CSRF_KEY: "${MEMORY_MCP_HTTP_CSRF_KEY:-00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff}"
      SURREALDB_CONTROL_URL: ws://surrealdb:8000/rpc
      SURREALDB_CONTROL_USERNAME: "${SURREALDB_USERNAME:-root}"
      SURREALDB_CONTROL_PASSWORD: "${SURREALDB_PASSWORD:-root}"
      SURREALDB_CONTROL_NAMESPACE: "${SURREALDB_CONTROL_NAMESPACE:-control}"
      SURREALDB_CONTROL_DB: "${SURREALDB_CONTROL_DB:-registry}"
      SURREALDB_TENANT_URL: ws://surrealdb:8000/rpc
      SURREALDB_TENANT_USERNAME: "${SURREALDB_USERNAME:-root}"
      SURREALDB_TENANT_PASSWORD: "${SURREALDB_PASSWORD:-root}"
      SURREALDB_TENANT_NAMESPACE: "${SURREALDB_TENANT_NAMESPACE:-tenant}"
      SURREALDB_TENANT_DB: "${SURREALDB_TENANT_DB:-tenant}"
      RUST_LOG: "${RUST_LOG:-info}"
      NER_EXTRACTOR: "${NER_EXTRACTOR:-anno}"
      EMBEDDINGS_ENABLED: "${EMBEDDINGS_ENABLED:-false}"

volumes:
  surrealdb-data:
