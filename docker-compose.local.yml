# Local administrator browser auth + CLI provisioning overlay.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
# Contains no OIDC-only variable at all: no issuer, client id, audience,
# redirect URI, allowed algorithm, operator identity allowlist, and no
# identity/state/nonce keys (local mode derives those from the session key).
# A nonempty OIDC value in this configuration fails startup rather than being
# silently ignored.
#
# `MEMORY_MCP_HTTP_PUBLIC_BASE_URL` must be an `https://` URL (or a localhost
# development URL); the server enforces that at startup. TLS may terminate at a
# trusted proxy that overwrites `Host`.
services:
  memory_mcp:
    environment:
      MEMORY_MCP_HTTP_ENABLE_CONTROL_PLANE: "true"
      # Must be set explicitly: only an image built with `control-plane-ui` and
      # a real bundle can serve the browser UI.
      MEMORY_MCP_HTTP_ENABLE_CONTROL_PLANE_UI: "${MEMORY_MCP_HTTP_ENABLE_CONTROL_PLANE_UI:?set to true only with an image built with control-plane-ui}"
      MEMORY_MCP_HTTP_AUTH_MODE: "local"
      MEMORY_MCP_HTTP_SIGNUP_MODE: "invite_only"
      MEMORY_MCP_HTTP_LOCAL_DEFAULT_PLAN_VERSION: "${MEMORY_MCP_HTTP_LOCAL_DEFAULT_PLAN_VERSION:?MEMORY_MCP_HTTP_LOCAL_DEFAULT_PLAN_VERSION is required in local mode}"

      # The seven explicit plan limits — all required in local mode, with no
      # fallback to a built-in default.
      MEMORY_MCP_HTTP_MAX_INGESTED_BYTES: "${MEMORY_MCP_HTTP_MAX_INGESTED_BYTES:?required in local mode}"
      MEMORY_MCP_HTTP_MAX_EPISODE_COUNT: "${MEMORY_MCP_HTTP_MAX_EPISODE_COUNT:?required in local mode}"
      MEMORY_MCP_HTTP_INGEST_PER_MINUTE: "${MEMORY_MCP_HTTP_INGEST_PER_MINUTE:?required in local mode}"
      MEMORY_MCP_HTTP_MAX_OPEN_APP_SESSIONS: "${MEMORY_MCP_HTTP_MAX_OPEN_APP_SESSIONS:?required in local mode}"
      MEMORY_MCP_HTTP_MAX_ACTIVE_API_KEYS: "${MEMORY_MCP_HTTP_MAX_ACTIVE_API_KEYS:?required in local mode}"
      MEMORY_MCP_HTTP_PER_TENANT_REQUEST_CONCURRENCY: "${MEMORY_MCP_HTTP_PER_TENANT_REQUEST_CONCURRENCY:?required in local mode}"
      MEMORY_MCP_HTTP_EXTRACTION_CONCURRENCY: "${MEMORY_MCP_HTTP_EXTRACTION_CONCURRENCY:?required in local mode}"
