name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.release }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Lint, tests and evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: ./.github/actions/setup
        with:
          target: x86_64-unknown-linux-gnu
          cache-key: quality
      - run: cargo fmt --all --check
      - name: Packaging regressions
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - run: cargo clippy --workspace --all-targets --features fs-watch,mcp-apps,streamable-http --locked -- -D warnings
      - name: Control-plane UI WASM lint
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy -p control-plane-ui --target wasm32-unknown-unknown --all-targets --locked -- -D warnings
      - name: Default workspace tests
        run: cargo test --workspace --lib --bins --tests --locked
      - name: Optional feature tests
        run: cargo test -p memory_mcp --lib --bins --tests --features fs-watch,mcp-apps,streamable-http,test-fixtures --locked
      - name: Check the HTTP profile and its internal back-compat name
        run: |
          set -euo pipefail
          # `streamable-http` is the documented profile switch. `control-plane` is
          # an internal name that pre-existing test and operator invocations still
          # pass on its own (the feature cycle keeps that compiling), so both
          # entry points must build without default features.
          for features in streamable-http control-plane; do
            echo "checking ${features} without default features"
            cargo check -p memory_mcp --all-targets --no-default-features \
              --features "${features},test-fixtures" --locked
          done
      - name: Evaluation gate
        env:
          EVAL_PROFILE: ${{ inputs.release && 'release' || 'pr' }}
        run: |
          mkdir -p target/evals
          cargo run -p eval-harness --bin memory-eval --locked -- run --profile "evals/profiles/$EVAL_PROFILE.json" --artifact "target/evals/$EVAL_PROFILE.json" --baseline "evals/baselines/one-active-namespace-$EVAL_PROFILE.json"
          make eval-response-size
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evaluation
          path: target/evals/*.json

  native:
    needs: quality
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: ./.github/actions/setup
        with:
          target: ${{ matrix.target }}
          cache-key: ${{ inputs.release && 'release' || 'dev' }}
      - name: macOS feature lint
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo clippy --workspace --all-targets --features fs-watch,mcp-apps,streamable-http,metal --locked -- -D warnings
      - name: Native unit and filesystem tests (Unix)
        # Hosted Windows runners consistently terminate the Rust test harness
        # with exit 101 after a long native dependency setup. Windows still
        # gets an end-to-end check below: build the real binaries, bundle
        # their DLLs, and run the packaged smoke test on both targets.
        if: ${{ !inputs.release && runner.os != 'Windows' }}
        run: |
          cargo test -p memory_mcp --lib --features fs-watch --locked
          cargo test -p memory_mcp --test fs_watch_process_enabled --features fs-watch --locked
      - name: Build CLI and HTTP server
        env:
          BUILD_PROFILE: ${{ inputs.release && 'release' || 'dev' }}
        run: cargo build -p memory_mcp --bins --profile "$BUILD_PROFILE" --features fs-watch,mcp-apps,streamable-http --locked
      - name: Package and test the actual binaries
        env:
          BUILD_DIR: target/${{ matrix.target }}/${{ inputs.release && 'release' || 'debug' }}
        run: python3 scripts/ci/package.py "$BUILD_DIR" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v6
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  docker:
    needs: quality
    name: Docker linux/amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: docker/setup-buildx-action@v3
      - name: Generate operator configuration for the smoke test
        shell: bash
        run: |
          set -euo pipefail
          # No secret is defaulted in the Compose file, so the job supplies
          # operator-generated values. The file is written outside the
          # workspace and is never uploaded as an artifact. It carries only what
          # the Compose file marks required: every method-specific value is an
          # empty default there, and the server reads an empty value as "not
          # set".
          ENV_FILE="${RUNNER_TEMP}/memory-mcp-smoke.env"
          hex64() { head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n'; }
          {
            echo "SURREALDB_USERNAME=ci-$(head -c 8 /dev/urandom | od -An -tx1 | tr -d ' \n')"
            echo "SURREALDB_PASSWORD=$(hex64)"
            echo "MEMORY_MCP_API_KEY_PEPPER=$(hex64)"
            echo "MEMORY_MCP_HTTP_SESSION_KEY=$(hex64)"
            echo "MEMORY_MCP_HTTP_CSRF_KEY=$(hex64)"
            echo "MEMORY_MCP_HTTP_PUBLIC_BASE_URL=https://localhost:8080"
            echo "ALLOWED_HOSTS=localhost,127.0.0.1"
            echo "ALLOWED_ORIGINS=https://localhost:8080"
          } > "${ENV_FILE}"
          chmod 600 "${ENV_FILE}"
          echo "SMOKE_ENV_FILE=${ENV_FILE}" >> "${GITHUB_ENV}"
      - name: Validate the Compose configuration resolves
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file "${SMOKE_ENV_FILE}" config --quiet
          # The browser method set is a runtime value, so the provider half has
          # to resolve from the same file rather than from a second overlay.
          hex64() { head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n'; }
          env \
            MEMORY_MCP_HTTP_AUTH_METHODS=local,oidc \
            MEMORY_MCP_HTTP_OIDC_ISSUER=https://idp.invalid/ \
            MEMORY_MCP_HTTP_OIDC_CLIENT_ID=ci-smoke-client \
            MEMORY_MCP_HTTP_OIDC_AUDIENCE=ci-smoke-audience \
            MEMORY_MCP_HTTP_OIDC_REDIRECT_URI=https://localhost:8080/auth/oidc/callback \
            "MEMORY_MCP_HTTP_IDENTITY_INDEX_KEY=$(hex64)" \
            "MEMORY_MCP_HTTP_OIDC_STATE_KEY=$(hex64)" \
            "MEMORY_MCP_HTTP_OIDC_NONCE_KEY=$(hex64)" \
            docker compose --env-file "${SMOKE_ENV_FILE}" config --quiet
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || inputs.release }}
      - name: Build distroless image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          tags: |
            memory-mcp-http:local
            ${{ steps.meta.outputs.tags }}
          load: true
      - name: Smoke test the final image
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker inspect -f '{{json .Config.Entrypoint}}' memory-mcp-http:local)" = '["/usr/local/bin/memory_mcp_http"]'
          test "$(docker inspect -f '{{.Config.User}}' memory-mcp-http:local)" = 'nonroot:nonroot'
          if docker run --rm --platform linux/amd64 --entrypoint /bin/sh memory-mcp-http:local -c true; then
            echo 'the final image unexpectedly contains a shell' >&2
            exit 1
          fi
      - name: Assert the final image has no UI sidecar
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker create memory-mcp-http:local)"
          trap 'docker rm "${container_id}" >/dev/null' EXIT
          docker export "${container_id}" | python3 -c '
          import sys
          import tarfile

          for member in tarfile.open(fileobj=sys.stdin.buffer, mode="r|"):
              name = member.name.removeprefix("./")
              if name == "src/control-plane-ui-dist" or name.startswith("src/control-plane-ui-dist/"):
                  raise SystemExit(f"UI sidecar found in final image: {name}")
          '
      - name: Start the HTTP service and probe liveness
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file "${SMOKE_ENV_FILE}" up -d --no-build
          curl --fail --silent --show-error \
            --retry 60 --retry-all-errors --retry-delay 2 \
            --connect-timeout 2 --max-time 10 \
            -H 'Host: localhost' \
            http://127.0.0.1:8080/health/live
          curl --fail --silent --show-error \
            --retry 60 --retry-all-errors --retry-delay 2 \
            --connect-timeout 2 --max-time 10 \
            -H 'Host: localhost' \
            http://127.0.0.1:8080/health/ready
          # The host allowlist is also part of the contract: an unlisted
          # Host must be refused rather than served.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Host: evil.example' http://127.0.0.1:8080/health/live)" = "403"
          # The disclosure names the set this run enabled, and the surfaces of
          # the methods it did not enable are absent rather than merely
          # unauthenticated. This run leaves AUTH_METHODS at the Compose default,
          # which is `local` alone.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Host: localhost' http://127.0.0.1:8080/api/v1/auth/config)" = "200"
          test "$(curl --silent -H 'Host: localhost' \
            http://127.0.0.1:8080/api/v1/auth/config | grep -c '"local"')" -ge 1
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Host: localhost' http://127.0.0.1:8080/auth/oidc/authorize)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Host: localhost' http://127.0.0.1:8080/api/v1/operator/recovery/status)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Host: localhost' http://127.0.0.1:8080/api/v1/not-a-route)" = "404"
      - name: Verify the UI is served entirely from the binary
        shell: bash
        run: |
          set -euo pipefail
          # The console is `include_bytes!`-ed into `memory_mcp_http` at compile
          # time, so a running image must serve the document and every asset it
          # references with no file on disk, no sidecar process and no
          # third-party origin. Reading the document is not enough on its own:
          # the loader fetches the WebAssembly by path from inside the module it
          # has already loaded, so the checker walks the served JavaScript too.
          # It re-asserts the serving policy against the shipped image, because
          # the crate's own unit tests run against a fixture instead.
          #
          # `--host-header` is required: the host allowlist compares the raw
          # `Host` header with no port stripping, so the loopback socket is
          # refused (`403`) unless it presents an allowlisted name verbatim.
          python3 scripts/ci/assert_embedded_ui.py \
            --base-url http://127.0.0.1:8080 \
            --host-header localhost
      - name: Log in to GitHub Container Registry
        if: ${{ github.ref == 'refs/heads/master' || inputs.release }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish image to GitHub Container Registry
        if: ${{ github.ref == 'refs/heads/master' || inputs.release }}
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
      - name: Show Compose logs on failure
        if: failure()
        shell: bash
        run: |
          # The file interpolates `${VAR:?}` references for the whole operator
          # surface, so naming its env file is what makes these diagnostics
          # resolvable at all.
          docker compose --env-file "${SMOKE_ENV_FILE}" ps
          docker compose --env-file "${SMOKE_ENV_FILE}" logs --no-color
      - name: Stop Compose services
        if: always()
        run: docker compose --env-file "${SMOKE_ENV_FILE}" down -v

  passed:
    name: CI passed
    if: always()
    needs: [quality, native, docker]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all checks and all five platforms
        env:
          QUALITY: ${{ needs.quality.result }}
          NATIVE: ${{ needs.native.result }}
          DOCKER: ${{ needs.docker.result }}
        run: test "$QUALITY" = success && test "$NATIVE" = success && test "$DOCKER" = success
