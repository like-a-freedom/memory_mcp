name: Build and Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      debug:
        description: Enable debug mode
        required: false
        default: 'false'
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.15.4
        with:
          toolchain: stable
          components: rustfmt
          cache: true

      - name: Run fmt check
        run: cargo fmt --all -- --check

  clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.15.4
        with:
          toolchain: stable
          components: clippy
          cache: true

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.15.4
        with:
          toolchain: stable
          cache: true

      - name: Run tests
        run: cargo test --workspace --lib --bins --tests

  coverage:
    name: Coverage
    if: github.event_name != 'pull_request'
    needs: [fmt, clippy, test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.15.4
        with:
          toolchain: stable
          cache: true

      - name: Cache tarpaulin coverage
        uses: actions/cache@v5
        with:
          path: ~/.cache/tarpaulin
          key: tarpaulin-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: tarpaulin-coverage-

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --version 0.34.1 --locked

      - name: Run coverage (tarpaulin)
        run: cargo tarpaulin --out Xml --ciserver github --run-types Tests --timeout 900

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./cobertura.xml
          flags: coverage
          verbose: true

  build_binaries:
    name: Build ${{ matrix.platform.os_name }}
    if: github.event_name == 'release'
    needs: [fmt, clippy, test]
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os_name: Linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: memory_mcp_linux_x86_64
          - os_name: macOS-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            bin: memory_mcp_macos_x86_64
          - os_name: macOS-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bin: memory_mcp_macos_aarch64
          - os_name: Windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: memory_mcp_windows_x86_64.exe
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.15.4
        with:
          toolchain: stable
          cache: true
          target: ${{ matrix.platform.target }}

      - name: Build binary
        run: cargo build -p memory_mcp --release --target ${{ matrix.platform.target }}

      - name: Prepare artifact (Unix)
        if: matrix.platform.os != 'windows-latest'
        run: |
          mkdir -p app/${{ matrix.platform.target }}
          if [ ! -f app/${{ matrix.platform.target }}/${{ matrix.platform.bin }} ]; then
            cp target/${{ matrix.platform.target }}/release/memory_mcp app/${{ matrix.platform.target }}/${{ matrix.platform.bin }}
          fi

      - name: Prepare artifact (Windows)
        if: matrix.platform.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path app/${{ matrix.platform.target }}
          Copy-Item target/${{ matrix.platform.target }}/release/memory_mcp.exe app/${{ matrix.platform.target }}/${{ matrix.platform.bin }}

      - name: Generate SHA-256 (Unix)
        if: matrix.platform.os != 'windows-latest'
        run: |
          shasum -a 256 app/${{ matrix.platform.target }}/${{ matrix.platform.bin }} | cut -d ' ' -f 1 > app/${{ matrix.platform.target }}/${{ matrix.platform.bin }}.sha256

      - name: Generate SHA-256 (Windows)
        if: matrix.platform.os == 'windows-latest'
        shell: pwsh
        run: |
          (Get-FileHash -Algorithm SHA256 app/${{ matrix.platform.target }}/${{ matrix.platform.bin }}).Hash.ToLower() | Out-File -Encoding ascii app/${{ matrix.platform.target }}/${{ matrix.platform.bin }}.sha256

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2.5.0
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            app/${{ matrix.platform.target }}/${{ matrix.platform.bin }}
            app/${{ matrix.platform.target }}/${{ matrix.platform.bin }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_docker_images:
    name: Build Docker images
    if: github.event_name == 'release'
    needs: [fmt, clippy, test]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/memory_mcp:latest
            ghcr.io/${{ github.repository_owner }}/memory_mcp:${{ github.ref_name }}
