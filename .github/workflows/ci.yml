name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # A new push to a branch supersedes the run already in flight for it, and a
  # release must not be cancelled by a later push.
  #
  # This is also the documented cause of `exit code 143` in a Rust CI: a
  # superseded run is sent SIGTERM, and the killed job's log ends mid-build
  # with no compiler diagnostic. That is the signature to recognise before
  # concluding a build was OOM-killed — 143 is SIGTERM, so a cancellation or a
  # timeout; the OOM killer sends SIGKILL, which surfaces as 137.
  cancel-in-progress: ${{ !inputs.release }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Lint, tests and evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: ./.github/actions/setup
        with:
          target: x86_64-unknown-linux-gnu
          cache-key: quality
          # Same target, same dev profile as the native Linux x64 job below:
          # one shared cache instead of two isolated ones rebuilding the same
          # dependency tree (rocksdb, ONNX, SurrealDB) per job.
          cache-shared-key: dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features fs-watch,mcp-apps,streamable-http --locked -- -D warnings
      - name: Control-plane UI WASM lint
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy -p ui --target wasm32-unknown-unknown --all-targets --locked -- -D warnings
      - name: Observability rules, alerts and dashboards
        run: |
          # 31 recording rules, 15 alerts and 4 panels groups that nothing
          # reached: a rule reading a metric the crate no longer exports
          # evaluates to empty and never fires, and a panel naming a deleted
          # series renders empty, which is indistinguishable from a subsystem
          # that is off. The checkers are Python; this step is a cargo
          # invocation, which is what ADR-0064 requires of CI.
          python3 -m pip install --quiet pyyaml
          cargo run --locked -p xtask -- check-observability
      - name: Default workspace tests
        run: cargo test --workspace --lib --bins --tests --locked
      - name: Optional feature tests
        run: cargo test -p memory_mcp --lib --bins --tests --features fs-watch,mcp-apps,streamable-http,test-fixtures --locked
      - name: Check the HTTP profile and its internal back-compat name
        run: |
          set -euo pipefail
          # `streamable-http` is the documented profile switch. `control-plane` is
          # an internal name that pre-existing test and operator invocations still
          # pass on its own (the feature cycle keeps that compiling), so both
          # entry points must build without default features.
          for features in streamable-http control-plane; do
            echo "checking ${features} without default features"
            cargo check -p memory_mcp --all-targets --no-default-features \
              --features "${features},test-fixtures" --locked
          done
      - name: Evaluation gate
        env:
          EVAL_PROFILE: ${{ inputs.release && 'release' || 'pr' }}
        run: |
          mkdir -p target/evals
          cargo run -p eval-harness --bin memory-eval --locked -- run --profile "evals/profiles/$EVAL_PROFILE.json" --artifact "target/evals/$EVAL_PROFILE.json" --baseline "evals/baselines/one-active-namespace-$EVAL_PROFILE.json"
          make eval-response-size
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evaluation
          path: target/evals/*.json

  native:
    needs: quality
    # The platform matrix starts for pull requests, manual runs and releases.
    # A push to master runs the quality gate only: the pull request already
    # exercised every platform, and the release rebuilds everything with the
    # release profile anyway.
    if: github.event_name != 'push'
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: ./.github/actions/setup
        with:
          target: ${{ matrix.target }}
          cache-key: ${{ inputs.release && 'release' || 'dev' }}
          cache-shared-key: ${{ inputs.release && 'release' || 'dev' }}
      - name: macOS feature lint
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo clippy --workspace --all-targets --features fs-watch,mcp-apps,streamable-http,metal --locked -- -D warnings
      - name: Native unit and filesystem tests (Unix)
        # Hosted Windows runners consistently terminate the Rust test harness
        # with exit 101 after a long native dependency setup. Windows still
        # gets an end-to-end check below: build the real binaries, bundle
        # their DLLs, and run the packaged smoke test on both targets.
        if: ${{ !inputs.release && runner.os != 'Windows' }}
        run: |
          cargo test -p memory_mcp --lib --features fs-watch --locked
          cargo test -p memory_mcp --test fs_watch_process_enabled --features fs-watch --locked
      - name: Require the console pin to agree
        # The console is built by the Dockerfile's `ui-builder` stage and
        # embedded in the image, and the `docker` job below proves the whole
        # path: it builds the image, starts it, and walks the document, the
        # loader and the WebAssembly module over HTTP. So this matrix entry
        # has nothing to add — and adding it cost a killed job.
        #
        # It used to build the bundle here, which meant `cargo install
        # dioxus-cli --locked`: a second dependency graph to compile, ~600
        # crates on top of the RocksDB/ONNX build already in flight, and on
        # the 7 GB runner that was enough to be OOM-killed — exit 143, with no
        # compiler diagnostic to read. It failed on this target alone because
        # this was the only entry that ran it.
        #
        # What it uniquely checked was the pin, and that check does not need
        # the bundler: `check-dioxus-pin` reads the Dockerfile and the UI
        # manifest, and the same rule is asserted as a unit test in xtask
        # (`the_images_dioxus_cli_matches_the_ui_crates_pin`) in the `quality`
        # job. So the guarantee survives at a fraction of the cost, and the
        # expensive proof of it runs where the artefact is actually built.
        run: cargo run --locked -p xtask -- check-dioxus-pin
      - name: Build CLI and HTTP server
        # No `MEMORY_MCP_UI_DIST` here: this matrix entry builds no console
        # bundle, so the `ui` feature compiles an empty catalog and these
        # binaries serve no UI. That is the documented developer fallback, not
        # a defect — the console these release artefacts would carry is built
        # and proved by the `docker` job, which is where a bundle is actually
        # embedded. This also means the shipped `.tar.gz` archives match the
        # README: the CLI has no console, the image does.
        env:
          BUILD_PROFILE: ${{ inputs.release && 'release' || 'dev' }}
        run: cargo build -p memory_mcp --bins --profile "$BUILD_PROFILE" --features fs-watch,mcp-apps,streamable-http --locked
      - name: Package and test the actual binaries
        env:
          BUILD_DIR: target/${{ matrix.target }}/${{ inputs.release && 'release' || 'debug' }}
        run: cargo run -p xtask --locked -- package "$BUILD_DIR" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v6
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  docker:
    needs: quality
    # Same policy as `native`: no image build on push — releases publish,
    # pull requests build and smoke-test without publishing.
    if: github.event_name != 'push'
    name: Docker linux/amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: docker/setup-buildx-action@v3
      - name: Generate operator configuration for the smoke test
        shell: bash
        run: |
          set -euo pipefail
          # No secret is defaulted in the Compose file, so the job supplies
          # operator-generated values. The file is written outside the
          # workspace and is never uploaded as an artifact. It carries only what
          # the Compose file marks required: every method-specific value is an
          # empty default there, and the server reads an empty value as "not
          # set".
          ENV_FILE="${RUNNER_TEMP}/memory-mcp-smoke.env"
          hex64() { head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n'; }
          {
            echo "SURREALDB_USERNAME=ci-$(head -c 8 /dev/urandom | od -An -tx1 | tr -d ' \n')"
            echo "SURREALDB_PASSWORD=$(hex64)"
            echo "MEMORY_MCP_API_KEY_PEPPER=$(hex64)"
            echo "MEMORY_MCP_HTTP_SESSION_KEY=$(hex64)"
            echo "MEMORY_MCP_HTTP_CSRF_KEY=$(hex64)"
            echo "MEMORY_MCP_HTTP_PUBLIC_BASE_URL=https://localhost:8080"
            echo "ALLOWED_HOSTS=localhost,127.0.0.1"
            echo "ALLOWED_ORIGINS=https://localhost:8080"
          } > "${ENV_FILE}"
          chmod 600 "${ENV_FILE}"
          echo "SMOKE_ENV_FILE=${ENV_FILE}" >> "${GITHUB_ENV}"
      - name: Validate the Compose configuration resolves
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file "${SMOKE_ENV_FILE}" config --quiet
          # The browser method set is a runtime value, so the provider half has
          # to resolve from the same file rather than from a second overlay.
          hex64() { head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n'; }
          env \
            MEMORY_MCP_HTTP_AUTH_METHODS=local,oidc \
            MEMORY_MCP_HTTP_OIDC_ISSUER=https://idp.invalid/ \
            MEMORY_MCP_HTTP_OIDC_CLIENT_ID=ci-smoke-client \
            MEMORY_MCP_HTTP_OIDC_AUDIENCE=ci-smoke-audience \
            MEMORY_MCP_HTTP_OIDC_REDIRECT_URI=https://localhost:8080/auth/oidc/callback \
            "MEMORY_MCP_HTTP_IDENTITY_INDEX_KEY=$(hex64)" \
            "MEMORY_MCP_HTTP_OIDC_STATE_KEY=$(hex64)" \
            "MEMORY_MCP_HTTP_OIDC_NONCE_KEY=$(hex64)" \
            docker compose --env-file "${SMOKE_ENV_FILE}" config --quiet
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || inputs.release }}
      - name: Build distroless image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          tags: |
            memory-mcp-http:local
            ${{ steps.meta.outputs.tags }}
          load: true
      - name: Smoke test the final image
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker inspect -f '{{json .Config.Entrypoint}}' memory-mcp-http:local)" = '["/usr/local/bin/memory_mcp_http"]'
          test "$(docker inspect -f '{{.Config.User}}' memory-mcp-http:local)" = 'nonroot:nonroot'
          if docker run --rm --platform linux/amd64 --entrypoint /bin/sh memory-mcp-http:local -c true; then
            echo 'the final image unexpectedly contains a shell' >&2
            exit 1
          fi
      - name: Assert the final image has no UI sidecar
        shell: bash
        run: |
          set -euo pipefail
          # The console is embedded at compile time, so the shipped image must
          # not also carry the bundle as files: a sidecar the binary never reads
          # is dead weight, and a future reader would reasonably assume the one
          # on disk is the one being served.
          #
          # `grep -q` is deliberately avoided. It exits on the first match and
          # closes the pipe, so `docker export` dies of SIGPIPE and `pipefail`
          # turns a *found* sidecar into a passing check. Draining the stream
          # and testing the captured text keeps the original semantics: the
          # archive is read to EOF, and the answer comes from what was in it.
          container_id="$(docker create memory-mcp-http:local)"
          trap 'docker rm "${container_id}" >/dev/null' EXIT
          sidecars="$(docker export "${container_id}" | tar -tf - \
            | grep -E '(^|/)src/ui-dist(/|$)' || true)"
          if [ -n "${sidecars}" ]; then
            echo "the final image ships the UI bundle as a sidecar:" >&2
            echo "${sidecars}" >&2
            exit 1
          fi
      - name: Start the HTTP service and probe liveness
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file "${SMOKE_ENV_FILE}" up -d --no-build
          curl --fail --silent --show-error \
            --retry 60 --retry-all-errors --retry-delay 2 \
            --connect-timeout 2 --max-time 10 \
            -H 'Host: localhost' \
            http://127.0.0.1:8080/health/live
          curl --fail --silent --show-error \
            --retry 60 --retry-all-errors --retry-delay 2 \
            --connect-timeout 2 --max-time 10 \
            -H 'Host: localhost' \
            http://127.0.0.1:8080/health/ready
          # The host allowlist is also part of the contract: an unlisted
          # Host must be refused rather than served.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Host: evil.example' http://127.0.0.1:8080/health/live)" = "403"
          # The disclosure names the set this run enabled, and the surfaces of
          # the methods it did not enable are absent rather than merely
          # unauthenticated. This run leaves AUTH_METHODS at the Compose default,
          # which is `local` alone.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Host: localhost' http://127.0.0.1:8080/api/v1/auth/config)" = "200"
          test "$(curl --silent -H 'Host: localhost' \
            http://127.0.0.1:8080/api/v1/auth/config | grep -c '"local"')" -ge 1
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Host: localhost' http://127.0.0.1:8080/auth/oidc/authorize)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Host: localhost' http://127.0.0.1:8080/api/v1/operator/recovery/status)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Host: localhost' http://127.0.0.1:8080/api/v1/not-a-route)" = "404"
      - name: Verify the UI is served entirely from the binary
        shell: bash
        run: |
          set -euo pipefail
          # The console is `include_bytes!`-ed into `memory_mcp_http` at compile
          # time, so a running image must serve the document and every asset it
          # references with no file on disk, no sidecar process and no
          # third-party origin. Reading the document is not enough on its own:
          # the loader fetches the WebAssembly by path from inside the module it
          # has already loaded, so the JavaScript is walked for the paths it
          # asks for and each one is fetched.
          #
          # This replaces `scripts/ci/assert_embedded_ui.py`, which made the
          # same walk in Python. The crate's own `ui_assets` test covers the
          # serving policy against a test fixture; this re-asserts it against
          # the shipped image.
          #
          # The `Host` header is required: the allowlist compares the raw header
          # with no port stripping, so the loopback socket is refused (`403`)
          # unless it presents an allowlisted name verbatim.
          fetch() {
            curl --fail --silent --show-error -H 'Host: localhost' "$1"
          }
          base=http://127.0.0.1:8080
          document="$(fetch "${base}/")"
          test -n "${document}"
          # Every asset the document references must come back. The URLs carry
          # the mounted base, so they are read out of the served document
          # rather than assumed.
          for path in $(printf '%s' "${document}" \
            | grep -oE '(src|href)="[^"]+"' \
            | sed -E 's/^(src|href)="//; s/"$//' \
            | sort -u); do
            case "${path}" in
              # An absolute URL is a third-party origin, which the single-binary
              # deployment is not allowed to load anything from.
              http://*|https://*|//*)
                echo "the console references a third-party origin: ${path}" >&2
                exit 1
                ;;
            esac
            test -n "$(fetch "${base}${path}")" || {
              echo "the console references an asset the binary does not serve: ${path}" >&2
              exit 1
            }
          done
          # The WebAssembly module is *not* referenced by the document: `dx
          # bundle` emits a `<script type="module">` and `<link rel=preload>`,
          # and the loader requests the `.wasm` by path from inside the
          # JavaScript it has already loaded. So the document is followed into
          # the script it names, and the module is read out of that — grepping
          # the document alone would find nothing and pass for the wrong reason.
          script_path="$(printf '%s' "${document}" \
            | grep -oE 'src="[^"]+\.js"' | head -1 | sed -E 's/^src="//; s/"$//')"
          test -n "${script_path}"
          wasm_path="$(fetch "${base}${script_path}" | grep -oE '/[^"]+\.wasm' | head -1)"
          test -n "${wasm_path}"
          test "$(curl --fail --silent --show-error -H 'Host: localhost' \
            -o /dev/null --write-out '%{content_type}' "${base}${wasm_path}")" \
            = "application/wasm"
          # The console's first load is dominated by the WebAssembly module, so
          # the shipped binary has to negotiate it: a client offering gzip must
          # receive a compressed body with a matching `Content-Encoding`, and
          # one that does not must receive the plain bytes. The header is read
          # as a value rather than counted, so a folded or duplicated header
          # cannot pass by accident.
          #
          # `curl --compressed` would hide this — it negotiates transparently
          # and the caller never sees which representation arrived — so the
          # two requests are made explicitly and compared by size.
          compressed_bytes="$(curl --fail --silent --show-error \
            -H 'Host: localhost' -H 'Accept-Encoding: gzip' \
            --output "${RUNNER_TEMP}/wasm.gz" \
            --write-out '%{size_download}' "${base}${wasm_path}")"
          identity_bytes="$(curl --fail --silent --show-error \
            -H 'Host: localhost' -H 'Accept-Encoding: identity' \
            --output "${RUNNER_TEMP}/wasm.raw" \
            --write-out '%{size_download}' "${base}${wasm_path}")"
          encoding="$(curl --fail --silent --show-error -I \
            -H 'Host: localhost' -H 'Accept-Encoding: gzip' \
            "${base}${wasm_path}" | tr -d '\r' \
            | sed -n 's/^[Cc]ontent-[Ee]ncoding: *//p')"
          case "${encoding}" in
            *gzip*) ;;
            *)
              echo "the shipped image does not compress the console wasm: ${encoding}" >&2
              exit 1
              ;;
          esac
          vary="$(curl --fail --silent --show-error -I \
            -H 'Host: localhost' -H 'Accept-Encoding: gzip' \
            "${base}${wasm_path}" | tr -d '\r' \
            | sed -n 's/^[Vv]ary: *//p')"
          case "${vary}" in
            *[Aa]ccept-[Ee]ncoding*) ;;
            *)
              echo "a compressed response must vary by Accept-Encoding: ${vary}" >&2
              exit 1
              ;;
          esac
          if [ "${compressed_bytes}" -ge "${identity_bytes}" ]; then
            echo "gzip did not shrink the console wasm: ${compressed_bytes} >= ${identity_bytes}" >&2
            exit 1
          fi
          # `gunzip` is the check that matters: a `Content-Encoding: gzip` whose
          # body is not valid gzip is a console that fails to boot, and the
          # size comparison alone would pass it.
          gunzip -c "${RUNNER_TEMP}/wasm.gz" | cmp -s - "${RUNNER_TEMP}/wasm.raw" || {
            echo "the gzipped console wasm does not decode to the identity bytes" >&2
            exit 1
          }
          # The security headers must hold on the image, not only in a test
          # fixture, because the SPA cannot boot without the WASM token. The
          # header is read as a value rather than counted, so a folded or
          # duplicated header cannot pass by accident.
          csp="$(curl --fail --silent --show-error -I -H 'Host: localhost' \
            "${base}/" | tr -d '\r' \
            | sed -n 's/^[Cc]ontent-[Ss]ecurity-[Pp]olicy: *//p')"
          case "${csp}" in
            *wasm-unsafe-eval*) ;;
            *)
              echo "the shipped image serves no CSP permitting WebAssembly: ${csp}" >&2
              exit 1
              ;;
          esac
          # The host allowlist is part of the contract, and the UI surface sits
          # behind the same boundary as every other route: a Host the
          # deployment does not list must be refused for the document and for
          # the assets too, not only for the routes registered before the
          # allowlist layer.
          for path in / "${script_path}"; do
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
              -H 'Host: not-allowlisted.example' "${base}${path}")" = "403" || {
              echo "an unlisted Host was served ${path} instead of refused" >&2
              exit 1
            }
          done
      - name: Log in to GitHub Container Registry
        if: ${{ github.ref == 'refs/heads/master' || inputs.release }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish image to GitHub Container Registry
        if: ${{ github.ref == 'refs/heads/master' || inputs.release }}
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
      - name: Show Compose logs on failure
        if: failure()
        shell: bash
        run: |
          # The file interpolates `${VAR:?}` references for the whole operator
          # surface, so naming its env file is what makes these diagnostics
          # resolvable at all.
          docker compose --env-file "${SMOKE_ENV_FILE}" ps
          docker compose --env-file "${SMOKE_ENV_FILE}" logs --no-color
      - name: Stop Compose services
        if: always()
        run: docker compose --env-file "${SMOKE_ENV_FILE}" down -v

  passed:
    name: CI passed
    if: always()
    needs: [quality, native, docker]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check this event is supposed to run
        env:
          EVENT: ${{ github.event_name }}
          QUALITY: ${{ needs.quality.result }}
          NATIVE: ${{ needs.native.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          test "$QUALITY" = success || exit 1
          if test "$EVENT" = push; then
            # Build jobs deliberately do not start on push: a skip is the
            # designed outcome there, a failure or cancellation is not.
            test "$NATIVE" = skipped && test "$DOCKER" = skipped
          else
            test "$NATIVE" = success && test "$DOCKER" = success
          fi
