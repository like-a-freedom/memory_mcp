name: Build and Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      debug:
        description: Enable debug mode
        required: false
        default: "false"
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "3 9 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          components: rustfmt
          cache: true

      - name: Run fmt check
        run: cargo fmt --all -- --check

  metadata:
    name: Cargo metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          cache: true

      - name: Validate locked metadata
        run: cargo metadata --locked --no-deps

  msrv:
    name: Rust MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: 1.88
          cache: true

      - name: Check MSRV
        run: cargo check --workspace --all-targets --locked

  clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          components: clippy
          cache: true

      - name: Run clippy
        # `metal` is a macOS-only Candle backend.  Keep the Linux gate focused
        # on the features that are supported by the runner instead of making
        # `--all-features` try to compile Metal on Ubuntu.
        run: cargo clippy --workspace --all-targets --features cli-watch,mcp-apps --locked -- -D warnings

  clippy_macos:
    name: Rust clippy (macOS features)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          components: clippy
          cache: true

      - name: Run clippy with all features
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          cache: true

      - name: Run tests
        run: cargo test --workspace --lib --bins --tests --locked

  eval-pr:
    name: Evaluation PR profile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          cache: true

      - name: Run PR evaluation
        run: |
          mkdir -p target/evals
          cargo run -p eval-harness --bin memory-eval -- run \
            --profile evals/profiles/pr.json \
            --artifact target/evals/pr.json

      - name: Upload eval artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-pr-artifact
          path: target/evals/pr.json
          retention-days: 30

  eval-nightly:
    name: Evaluation nightly profile
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          cache: true

      - name: Run nightly evaluation
        run: |
          mkdir -p target/evals
          cargo run -p eval-harness --bin memory-eval -- run \
            --profile evals/profiles/nightly.json \
            --artifact target/evals/nightly.json
        continue-on-error: true

      - name: Upload nightly artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-nightly-artifact
          path: target/evals/nightly.json
          retention-days: 30

  eval-release:
    name: Evaluation release profile
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          cache: true

      - name: Run release evaluation
        run: |
          mkdir -p target/evals
          cargo run -p eval-harness --bin memory-eval -- run \
            --profile evals/profiles/release.json \
            --artifact target/evals/release.json
        continue-on-error: true

      - name: Upload release artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-release-artifact
          path: target/evals/release.json
          retention-days: 30

  build_binaries:
    name: Build ${{ matrix.platform.os_name }}
    if: github.event_name == 'release'
    needs: [fmt, metadata, clippy, clippy_macos, test, msrv]
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os_name: Linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: memory_mcp_linux_x86_64
          - os_name: macOS-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            bin: memory_mcp_macos_x86_64
          - os_name: macOS-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bin: memory_mcp_macos_aarch64
          - os_name: Windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: memory_mcp_windows_x86_64.exe
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          cache: true
          target: ${{ matrix.platform.target }}

      - name: Build binary
        run: cargo build -p memory_mcp --release --target ${{ matrix.platform.target }} --locked

      - name: Prepare artifact (Unix)
        if: matrix.platform.os != 'windows-latest'
        run: |
          mkdir -p app/${{ matrix.platform.target }}
          if [ ! -f app/${{ matrix.platform.target }}/${{ matrix.platform.bin }} ]; then
            cp target/${{ matrix.platform.target }}/release/memory_mcp app/${{ matrix.platform.target }}/${{ matrix.platform.bin }}
          fi

      - name: Prepare artifact (Windows)
        if: matrix.platform.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path app/${{ matrix.platform.target }}
          Copy-Item target/${{ matrix.platform.target }}/release/memory_mcp.exe app/${{ matrix.platform.target }}/${{ matrix.platform.bin }}

      - name: Smoke test binary (Unix)
        if: matrix.platform.os != 'windows-latest'
        run: |
          target/${{ matrix.platform.target }}/release/memory_mcp --version
          target/${{ matrix.platform.target }}/release/memory_mcp init --target vscode > init-output.json
          python3 -c 'import json; from pathlib import Path; payload=json.loads(Path("init-output.json").read_text()); assert payload["mutates_files"] is False; assert payload["target"] == "vscode"'

      - name: Smoke test binary (Windows)
        if: matrix.platform.os == 'windows-latest'
        shell: pwsh
        run: |
          target/${{ matrix.platform.target }}/release/memory_mcp.exe --version
          target/${{ matrix.platform.target }}/release/memory_mcp.exe init --target vscode | Out-File -Encoding utf8 init-output.json
          $payload = Get-Content init-output.json -Raw | ConvertFrom-Json
          if ($payload.mutates_files -ne $false -or $payload.target -ne 'vscode') { throw 'invalid init smoke-test result' }

      - name: Smoke test zero-config runtime (Unix)
        if: matrix.platform.os != 'windows-latest'
        run: |
          bash scripts/measure_ttv.sh \
            --binary target/${{ matrix.platform.target }}/release/memory_mcp \
            --persona release-binary \
            --repeat 1 > ttv-output.json
          python3 -c 'import json; from pathlib import Path; payload=json.loads(Path("ttv-output.json").read_text()); assert payload["success"] is True; assert payload["median_seconds"]["total_seconds"] <= 300'

      # Every release selector must boot and extract without a model download:
      # anno and regex are local and download-free; the model-backed selectors
      # (anno-onnx, urchade/gliner_multi-v2.1, VAGOsolutions/...) are covered
      # by the fixture-gated integration tests (test job) because CI has no
      # local checkpoints.
      - name: Smoke test NER selectors (Unix)
        if: matrix.platform.os != 'windows-latest'
        run: |
          for selector in anno regex; do
            NER_EXTRACTOR=$selector SURREALDB_EMBEDDED=true \
              SURREALDB_DATA_DIR=$(mktemp -d) SURREALDB_DB_NAME=smoke \
              SURREALDB_NAMESPACES=org SURREALDB_USERNAME=root SURREALDB_PASSWORD=root \
              EMBEDDINGS_ENABLED=false \
              target/${{ matrix.platform.target }}/release/memory_mcp ingest \
              --source-type smoke --source-id selector-$selector \
              --content 'Alice Smith from OpenAI presented Project Atlas.' \
              --t-ref 2026-02-05T00:00:00Z
          done

      - name: Smoke test NER selectors (Windows)
        if: matrix.platform.os == 'windows-latest'
        shell: pwsh
        run: |
          foreach ($selector in @('anno', 'regex')) {
            $env:NER_EXTRACTOR = $selector
            $env:SURREALDB_EMBEDDED = 'true'
            $env:SURREALDB_DATA_DIR = (New-Item -ItemType Directory -Force "$env:TEMP\ner-smoke-$selector").FullName
            $env:SURREALDB_DB_NAME = 'smoke'
            $env:SURREALDB_NAMESPACES = 'org'
            $env:SURREALDB_USERNAME = 'root'
            $env:SURREALDB_PASSWORD = 'root'
            $env:EMBEDDINGS_ENABLED = 'false'
            & target/${{ matrix.platform.target }}/release/memory_mcp.exe ingest `
              --source-type smoke --source-id selector-$selector `
              --content 'Alice Smith from OpenAI presented Project Atlas.' `
              --t-ref 2026-02-05T00:00:00Z
            if ($LASTEXITCODE -ne 0) { throw "NER selector $selector smoke failed" }
          }

      - name: Generate SHA-256 (Unix)
        if: matrix.platform.os != 'windows-latest'
        run: |
          shasum -a 256 app/${{ matrix.platform.target }}/${{ matrix.platform.bin }} | cut -d ' ' -f 1 > app/${{ matrix.platform.target }}/${{ matrix.platform.bin }}.sha256

      - name: Generate SHA-256 (Windows)
        if: matrix.platform.os == 'windows-latest'
        shell: pwsh
        run: |
          (Get-FileHash -Algorithm SHA256 app/${{ matrix.platform.target }}/${{ matrix.platform.bin }}).Hash.ToLower() | Out-File -Encoding ascii app/${{ matrix.platform.target }}/${{ matrix.platform.bin }}.sha256

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            app/${{ matrix.platform.target }}/${{ matrix.platform.bin }}
            app/${{ matrix.platform.target }}/${{ matrix.platform.bin }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
