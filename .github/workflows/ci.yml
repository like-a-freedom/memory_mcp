name: Build and Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      debug:
        description: Enable debug mode
        required: false
        default: "false"
  push:
    branches: [main, master]
  schedule:
    - cron: "3 9 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

jobs:
  # ── Stage 1: Format ──────────────────────────────────────────────
  fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          components: rustfmt
          cache: true
      - name: Run fmt check
        run: cargo fmt --all -- --check

  # ── Stage 2: Lint (parallel within stage) ────────────────────────
  clippy:
    name: Rust clippy
    needs: [fmt]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          components: clippy
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --features fs-watch,mcp-apps,streamable-http,control-plane --locked -- -D warnings
      - name: Check additive HTTP feature composition
        run: >-
          cargo check -p memory_mcp --all-targets --no-default-features
          --features streamable-http,prometheus,control-plane,test-fixtures
          --locked
      - name: Run 20-tenant HTTP load gate
        run: >-
          cargo test -p memory_mcp
          --features streamable-http,mcp-apps,control-plane,test-fixtures
          --test http_load_concurrency
          load_20_active_tenants_under_expected_qps
          -- --test-threads=1

  clippy_macos:
    name: Rust clippy (macOS features)
    needs: [fmt]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          components: clippy
      - name: Run clippy with macOS features
        run: cargo clippy --workspace --all-targets --features fs-watch,mcp-apps,streamable-http,control-plane,metal --locked -- -D warnings

  msrv:
    name: Pinned Rust
    needs: [fmt]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: 1.97.1
      - name: Check MSRV
        run: cargo check --workspace --all-targets --locked

  # ── Stage 3: Test (parallel within stage) ────────────────────────
  test:
    name: Rust tests
    needs: [clippy, clippy_macos, msrv]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
      - name: Run tests
        run: cargo test --workspace --lib --bins --tests --locked

  fs_watch_windows:
    name: Filesystem ingestion (Windows)
    needs: [clippy, clippy_macos, msrv]
    runs-on: windows-latest
    timeout-minutes: 40
    continue-on-error: true
    env:
      CFLAGS: "/MT"
      CMAKE_C_FLAGS: "/MT"
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
      - name: Run candidate path-normalization tests
        shell: pwsh
        run: |
          cargo test -p memory_mcp service::fs_watch::candidate --features fs-watch --locked
          if ($LASTEXITCODE -ne 0) { throw "candidate path normalization failed on Windows" }
      - name: Run enabled process tests
        shell: pwsh
        run: |
          cargo test -p memory_mcp --test fs_watch_process_enabled --features fs-watch --locked
          if ($LASTEXITCODE -ne 0) { throw "fs_watch_process_enabled failed on Windows" }

  # ── Stage 4: Evaluate ────────────────────────────────────────────
  eval-pr:
    name: Evaluation PR profile
    needs: [test]
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
      - name: Run PR evaluation
        run: |
          mkdir -p target/evals
          cargo run -p eval-harness --bin memory-eval -- run \
            --profile evals/profiles/pr.json \
            --artifact target/evals/pr.json \
            --baseline evals/baselines/one-active-namespace-pr.json
      - name: Run response-size evaluation
        run: make eval-response-size
      - name: Upload eval artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eval-pr-artifact
          path: target/evals/*.json
          retention-days: 30

  eval-release:
    name: Evaluation release profile
    needs: [test]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
      - name: Run release evaluation
        run: |
          mkdir -p target/evals
          cargo run -p eval-harness --bin memory-eval -- run \
            --profile evals/profiles/release.json \
            --artifact target/evals/release.json \
            --baseline evals/baselines/one-active-namespace-release.json
      - name: Upload release artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eval-release-artifact
          path: target/evals/release.json
          retention-days: 30

  eval-nightly:
    name: Evaluation nightly profile
    needs: [test]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
      - name: Run nightly evaluation
        run: |
          mkdir -p target/evals
          cargo run -p eval-harness --bin memory-eval -- run \
            --profile evals/profiles/nightly.json \
            --artifact target/evals/nightly.json
      - name: Run response-size benchmark profile
        run: make eval-response-size
      - name: Run NER quality benchmark profile
        if: vars.MEMORY_NER_FIXTURES_PROVISIONED == 'true'
        run: make eval-ner-quality
      - name: Record NER fixture prerequisite
        if: vars.MEMORY_NER_FIXTURES_PROVISIONED != 'true'
        run: echo 'NER quality not executed; run make eval-ner-quality on a host with the pinned model fixtures.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload nightly artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eval-nightly-artifact
          path: target/evals/*.json
          retention-days: 30

  benchmark_compile:
    name: Benchmark profiles compile
    needs: [test]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
      - name: Compile Criterion benchmark targets
        run: make bench-check

  benchmark-nightly:
    name: CPU benchmark profiles
    needs: [test]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
      - name: Run CPU Criterion benchmarks
        run: |
          make bench-cpu-core
          if test -d crates/memory-mcp/tests/models/ner; then
            MEMORY_MCP_BENCH_REQUIRE_FIXTURES=1 cargo bench -p eval-harness --bench ner_cpu --locked
          else
            echo "NER CPU benchmark not executed: model fixtures are not provisioned in CI"
            echo "Run MEMORY_MCP_BENCH_REQUIRE_FIXTURES=1 make bench-cpu on a fixture-equipped host"
          fi
      - name: Upload Criterion reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: criterion-cpu-nightly
          path: target/criterion
          if-no-files-found: warn
          retention-days: 30

  # ── Stage 5: Build (release only) ────────────────────────────────
  build_binaries:
    name: Build ${{ matrix.platform.os_name }}
    needs: [eval-release]
    if: github.event_name == 'release'
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os_name: Linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: memory_mcp_linux_x86_64
          - os_name: macOS-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            bin: memory_mcp_macos_x86_64
          - os_name: macOS-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bin: memory_mcp_macos_aarch64
          - os_name: Windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: memory_mcp_windows_x86_64.exe
            cflags: "/MT"
            cmake_c_flags: "/MT"
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          target: ${{ matrix.platform.target }}
      - name: Build binary
        run: cargo build -p memory_mcp --release --target ${{ matrix.platform.target }} --features fs-watch --locked
        env:
          CFLAGS: ${{ matrix.platform.cflags }}
          CMAKE_C_FLAGS: ${{ matrix.platform.cmake_c_flags }}
      - name: Prepare artifact (Unix)
        if: matrix.platform.os != 'windows-latest'
        run: |
          mkdir -p app/${{ matrix.platform.target }}
          if [ ! -f app/${{ matrix.platform.target }}/${{ matrix.platform.bin }} ]; then
            cp target/${{ matrix.platform.target }}/release/memory_mcp app/${{ matrix.platform.target }}/${{ matrix.platform.bin }}
          fi
      - name: Prepare artifact (Windows)
        if: matrix.platform.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path app/${{ matrix.platform.target }}
          Copy-Item target/${{ matrix.platform.target }}/release/memory_mcp.exe app/${{ matrix.platform.target }}/${{ matrix.platform.bin }}
      - name: Smoke test binary (Unix)
        if: matrix.platform.os != 'windows-latest'
        run: |
          target/${{ matrix.platform.target }}/release/memory_mcp --version
          target/${{ matrix.platform.target }}/release/memory_mcp init --target vscode > init-output.json
          python3 -c 'import json; from pathlib import Path; payload=json.loads(Path("init-output.json").read_text()); assert payload["mutates_files"] is False; assert payload["target"] == "vscode"'
      - name: Smoke test binary (Windows)
        if: matrix.platform.os == 'windows-latest'
        shell: pwsh
        run: |
          target/${{ matrix.platform.target }}/release/memory_mcp.exe --version
          target/${{ matrix.platform.target }}/release/memory_mcp.exe init --target vscode | Out-File -Encoding utf8 init-output.json
          $payload = Get-Content init-output.json -Raw | ConvertFrom-Json
          if ($payload.mutates_files -ne $false -or $payload.target -ne 'vscode') { throw 'invalid init smoke-test result' }
      - name: Smoke test zero-config runtime (Unix)
        if: matrix.platform.os != 'windows-latest'
        run: |
          bash scripts/measure_ttv.sh \
            --binary target/${{ matrix.platform.target }}/release/memory_mcp \
            --persona release-binary \
            --repeat 1 > ttv-output.json
          python3 -c 'import json; from pathlib import Path; payload=json.loads(Path("ttv-output.json").read_text()); assert payload["success"] is True; assert payload["median_seconds"]["total_seconds"] <= 300'
      - name: Smoke test NER selectors (Unix)
        if: matrix.platform.os != 'windows-latest'
        run: |
          for selector in anno regex; do
            NER_EXTRACTOR=$selector SURREALDB_EMBEDDED=true \
              SURREALDB_DATA_DIR=$(mktemp -d) SURREALDB_DB_NAME=smoke \
              SURREALDB_NAMESPACE=org SURREALDB_USERNAME=root SURREALDB_PASSWORD=root \
              EMBEDDINGS_ENABLED=false \
              target/${{ matrix.platform.target }}/release/memory_mcp ingest \
              --source-type smoke --source-id selector-$selector \
              --content 'Alice Smith from OpenAI presented Project Atlas.' \
              --t-ref 2026-02-05T00:00:00Z
          done
      - name: Smoke test NER selectors (Windows)
        if: matrix.platform.os == 'windows-latest'
        shell: pwsh
        run: |
          foreach ($selector in @('anno', 'regex')) {
            $env:NER_EXTRACTOR = $selector
            $env:SURREALDB_EMBEDDED = 'true'
            $env:SURREALDB_DATA_DIR = (New-Item -ItemType Directory -Force "$env:TEMP\ner-smoke-$selector").FullName
            $env:SURREALDB_DB_NAME = 'smoke'
            $env:SURREALDB_NAMESPACE = 'org'
            $env:SURREALDB_USERNAME = 'root'
            $env:SURREALDB_PASSWORD = 'root'
            $env:EMBEDDINGS_ENABLED = 'false'
            & target/${{ matrix.platform.target }}/release/memory_mcp.exe ingest `
              --source-type smoke --source-id selector-$selector `
              --content 'Alice Smith from OpenAI presented Project Atlas.' `
              --t-ref 2026-02-05T00:00:00Z
            if ($LASTEXITCODE -ne 0) { throw "NER selector $selector smoke failed" }
          }
      - name: Smoke test filesystem ingestion (Unix)
        if: matrix.platform.os != 'windows-latest'
        timeout-minutes: 30
        run: |
          MEMORY_RELEASE_BINARY=target/${{ matrix.platform.target }}/release/memory_mcp \
            cargo test -p memory_mcp --test release_binary_fs_watch --features fs-watch -- --nocapture
      - name: Smoke test filesystem ingestion (Windows)
        if: matrix.platform.os == 'windows-latest'
        shell: pwsh
        timeout-minutes: 15
        run: |
          $env:MEMORY_RELEASE_BINARY = "target\${{ matrix.platform.target }}\release\memory_mcp.exe"
          cargo test -p memory_mcp --test release_binary_fs_watch --features fs-watch -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "filesystem ingestion release smoke failed" }
      - name: Generate SHA-256 (Unix)
        if: matrix.platform.os != 'windows-latest'
        run: |
          shasum -a 256 app/${{ matrix.platform.target }}/${{ matrix.platform.bin }} | cut -d ' ' -f 1 > app/${{ matrix.platform.target }}/${{ matrix.platform.bin }}.sha256
      - name: Generate SHA-256 (Windows)
        if: matrix.platform.os == 'windows-latest'
        shell: pwsh
        run: |
          (Get-FileHash -Algorithm SHA256 app/${{ matrix.platform.target }}/${{ matrix.platform.bin }}).Hash.ToLower() | Out-File -Encoding ascii app/${{ matrix.platform.target }}/${{ matrix.platform.bin }}.sha256
      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            app/${{ matrix.platform.target }}/${{ matrix.platform.bin }}
            app/${{ matrix.platform.target }}/${{ matrix.platform.bin }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
