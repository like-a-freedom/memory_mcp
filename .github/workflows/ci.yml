name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.release }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Lint, tests and evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: ./.github/actions/setup
        with:
          target: x86_64-unknown-linux-gnu
          cache-key: quality
      - run: cargo fmt --all --check
      - name: Packaging regressions
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - run: cargo clippy --workspace --all-targets --features fs-watch,mcp-apps,streamable-http,control-plane --locked -- -D warnings
      - name: Default workspace tests
        run: cargo test --workspace --lib --bins --tests --locked
      - name: Optional feature tests
        run: cargo test -p memory_mcp --lib --bins --tests --features fs-watch,mcp-apps,streamable-http,control-plane,test-fixtures --locked
      - name: Check additive HTTP features
        run: cargo check -p memory_mcp --all-targets --no-default-features --features streamable-http,prometheus,control-plane,test-fixtures --locked
      - name: Evaluation gate
        env:
          EVAL_PROFILE: ${{ inputs.release && 'release' || 'pr' }}
        run: |
          mkdir -p target/evals
          cargo run -p eval-harness --bin memory-eval --locked -- run --profile "evals/profiles/$EVAL_PROFILE.json" --artifact "target/evals/$EVAL_PROFILE.json" --baseline "evals/baselines/one-active-namespace-$EVAL_PROFILE.json"
          make eval-response-size
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evaluation
          path: target/evals/*.json

  native:
    needs: quality
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: ./.github/actions/setup
        with:
          target: ${{ matrix.target }}
          cache-key: ${{ inputs.release && 'release' || 'dev' }}
      - name: macOS feature lint
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo clippy --workspace --all-targets --features fs-watch,mcp-apps,streamable-http,control-plane,metal --locked -- -D warnings
      - name: Native unit and filesystem tests (Unix)
        # Hosted Windows runners consistently terminate the Rust test harness
        # with exit 101 after a long native dependency setup. Windows still
        # gets an end-to-end check below: build the real binaries, bundle
        # their DLLs, and run the packaged smoke test on both targets.
        if: ${{ !inputs.release && runner.os != 'Windows' }}
        run: |
          cargo test -p memory_mcp --lib --features fs-watch --locked
          cargo test -p memory_mcp --test fs_watch_process_enabled --features fs-watch --locked
      - name: Build CLI and HTTP server
        env:
          BUILD_PROFILE: ${{ inputs.release && 'release' || 'dev' }}
        run: cargo build -p memory_mcp --bins --profile "$BUILD_PROFILE" --features fs-watch,mcp-apps,streamable-http,control-plane --locked
      - name: Package and test the actual binaries
        env:
          BUILD_DIR: target/${{ matrix.target }}/${{ inputs.release && 'release' || 'debug' }}
        run: python3 scripts/ci/package.py "$BUILD_DIR" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v6
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  docker:
    needs: quality
    name: Docker linux/amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose file
        run: docker compose -f docker-compose.yml config --quiet
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || inputs.release }}
      - name: Build distroless image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          tags: |
            memory-mcp-http:local
            ${{ steps.meta.outputs.tags }}
          load: true
      - name: Smoke test the final image
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker inspect -f '{{json .Config.Entrypoint}}' memory-mcp-http:local)" = '["/usr/local/bin/memory_mcp_http"]'
          test "$(docker inspect -f '{{.Config.User}}' memory-mcp-http:local)" = 'nonroot:nonroot'
          if docker run --rm --platform linux/amd64 --entrypoint /bin/sh memory-mcp-http:local -c true; then
            echo 'the final image unexpectedly contains a shell' >&2
            exit 1
          fi
      - name: Start the HTTP service and probe liveness
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml up -d --no-build
          curl --fail --silent --show-error \
            --retry 60 --retry-all-errors --retry-delay 2 \
            --connect-timeout 2 --max-time 10 \
            http://127.0.0.1:8080/health/live
          curl --fail --silent --show-error \
            --retry 60 --retry-all-errors --retry-delay 2 \
            --connect-timeout 2 --max-time 10 \
            http://127.0.0.1:8080/health/ready
      - name: Log in to GitHub Container Registry
        if: ${{ github.ref == 'refs/heads/master' || inputs.release }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish image to GitHub Container Registry
        if: ${{ github.ref == 'refs/heads/master' || inputs.release }}
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
      - name: Show Compose logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml logs --no-color
      - name: Stop Compose services
        if: always()
        run: docker compose -f docker-compose.yml down -v

  passed:
    name: CI passed
    if: always()
    needs: [quality, native, docker]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all checks and all five platforms
        env:
          QUALITY: ${{ needs.quality.result }}
          NATIVE: ${{ needs.native.result }}
          DOCKER: ${{ needs.docker.result }}
        run: test "$QUALITY" = success && test "$NATIVE" = success && test "$DOCKER" = success
