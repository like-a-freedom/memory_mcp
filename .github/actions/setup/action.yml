name: Rust build environment
description: Native toolchain and isolated dependency cache
inputs:
  target:
    description: Native Rust host triple
    required: true
  cache-key:
    description: Separate check and release build caches
    required: true
  cache-shared-key:
    description: >-
      Optional job-independent cache fragment. When set, rust-cache replaces
      the automatic job-based key with it, so sibling jobs on the same
      target and profile share one cache instead of rebuilding the same
      dependency tree per job.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Configure native build
      shell: bash
      run: echo "CARGO_BUILD_TARGET=${{ inputs.target }}" >> "$GITHUB_ENV"
    - name: Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends libclang-dev cmake libssl-dev pkg-config
    - name: Windows native dependencies
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $clang = Join-Path $env:ProgramFiles 'LLVM\bin'
        if (!(Test-Path "$clang\libclang.dll")) { throw 'LLVM libclang.dll is required by RocksDB' }
        "LIBCLANG_PATH=$clang" >> $env:GITHUB_ENV
        # Keep the toolchain's default dynamic MSVC CRT for every dependency.
        # ONNX Runtime is built with /MD, while exporting /MT here is also
        # interpreted as a Git-for-Windows path by clang-cl on ARM runners.
    - name: Windows runtime search path
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $target = Join-Path $env:GITHUB_WORKSPACE "target\${{ inputs.target }}\debug"
        # ort-sys copies its runtime DLLs into the target directory when
        # Windows Developer Mode is unavailable; Cargo runs tests from deps.
        $target >> $env:GITHUB_PATH
        (Join-Path $target 'deps') >> $env:GITHUB_PATH
    - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
      with:
        toolchain: 1.97.1
        target: ${{ inputs.target }}
        components: rustfmt,clippy
        # Keep the setup action from injecting project-wide flags; clippy owns
        # the lint policy in the quality job.
        rustflags: ""
        cache: true
        cache-key: native-v3-${{ inputs.target }}-${{ inputs.cache-key }}
        cache-shared-key: ${{ inputs.cache-shared-key != '' && format('native-v3-{0}-{1}', inputs.target, inputs.cache-shared-key) || '' }}
        cache-on-failure: false
        cache-save-if: ${{ github.event_name != 'pull_request' }}
