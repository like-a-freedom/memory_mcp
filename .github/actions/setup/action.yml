name: Rust build environment
description: Native toolchain and isolated dependency cache
inputs:
  target:
    description: Native Rust host triple
    required: true
  cache-key:
    description: Separate check and release build caches
    required: true
  cache-shared-key:
    description: Optional stable job-independent dependency cache key
    required: false
    default: ""
  cache-save:
    description: Allow this job to write the cache; parallel readers must use false
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Configure native build
      shell: bash
      run: echo "CARGO_BUILD_TARGET=${{ inputs.target }}" >> "$GITHUB_ENV"
    - name: Free disk space on Linux
      # GitHub guarantees 14 GB on every standard runner, and this build writes
      # a RocksDB target directory well past it. rust-lang's own CI clears
      # space on every hosted Linux job for the same reason, and a build killed
      # at the disk limit fails with `ENOSPC` from whichever `-sys` crate
      # happened to be writing — which looks like a compile error in a
      # dependency rather than a runner that ran out of room.
      #
      # `swap-storage` is deliberately not removed: the action can reclaim the
      # swap file, and a job that then dies under memory pressure gives no
      # diagnostic at all. Leaving the swap in place is what makes a
      # memory-bound build slow rather than silent.
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        echo "before: $(df -h --output=avail / | tail -1 | tr -s ' ')"
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        echo "after:  $(df -h --output=avail / | tail -1 | tr -s ' ')"
    - name: Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends libclang-dev cmake libssl-dev pkg-config
    - name: Windows native dependencies
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $clang = Join-Path $env:ProgramFiles 'LLVM\bin'
        if (!(Test-Path "$clang\libclang.dll")) { throw 'LLVM libclang.dll is required by RocksDB' }
        "LIBCLANG_PATH=$clang" >> $env:GITHUB_ENV
        # Keep the toolchain's default dynamic MSVC CRT for every dependency.
        # ONNX Runtime is built with /MD, while exporting /MT here is also
        # interpreted as a Git-for-Windows path by clang-cl on ARM runners.
    - name: Windows runtime search path
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $target = Join-Path $env:GITHUB_WORKSPACE "target\${{ inputs.target }}\debug"
        # ort-sys copies its runtime DLLs into the target directory when
        # Windows Developer Mode is unavailable; Cargo runs tests from deps.
        $target >> $env:GITHUB_PATH
        (Join-Path $target 'deps') >> $env:GITHUB_PATH
    - name: Windows ORT link directories
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # ort-sys 2.0.0-rc.12 copies the ONNX Runtime DLLs next to the build
        # output and into `examples` and `deps` siblings, then panics when a
        # copy fallback hits a directory that does not exist. Cargo never
        # creates the `examples` siblings for a plain `cargo build`, so a cold
        # cache failed both Windows release builds. The set covers host-profile
        # builds, `--target` builds and the `build` directory the 2.0.0-rc.12
        # copy resolves to.
        $bases = @('target', (Join-Path 'target' '${{ inputs.target }}')) | Select-Object -Unique
        $paths = foreach ($base in $bases) {
          foreach ($profile in 'debug', 'release') {
            $root = Join-Path $base $profile
            $root
            Join-Path $root 'examples'
            Join-Path $root 'deps'
            $build = Join-Path $root 'build'
            $build
            Join-Path $build 'examples'
            Join-Path $build 'deps'
          }
        }
        New-Item -ItemType Directory -Force -Path $paths | Out-Null
    - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
      with:
        # Use the same rolling channel as `rust-toolchain.toml` and the official
        # `rust:slim-trixie` image tags. `rust-version` is only the MSRV floor.
        # `xtask check-toolchain-pin` checks that all three selectors agree.
        toolchain: stable
        target: ${{ inputs.target }}
        components: rustfmt,clippy
        # Keep the setup action from injecting project-wide flags; clippy owns
        # the lint policy in the quality job.
        rustflags: ""
        cache: true
        # Retain the existing namespace so this change does not force cold
        # dependency builds. The caller selects exactly one writer per key.
        cache-key: native-v3-${{ inputs.target }}-${{ inputs.cache-key }}
        cache-shared-key: ${{ inputs.cache-shared-key != '' && format('native-v3-{0}-{1}', inputs.target, inputs.cache-shared-key) || '' }}
        cache-on-failure: true
        # The owning job saves on every event, PRs included; readers only
        # restore. Caches are scoped to
        # their branch, so later pushes of the same PR reuse the first build
        # (a cold rebuild per push was the biggest repeated cost for PRs that
        # touch Cargo.lock). A failed job still saves what it compiled: the
        # cache is keyed on Cargo.lock and the rustc version, so the next
        # run reuses the dependency tree and only rebuilds what changed.
        #
        # This covers a job that fails but still runs its post steps. It does
        # not cover a runner that is lost mid-build — the rust-cache save runs
        # in the post step, and a lost runner skips post steps entirely. That
        # failure mode requires re-running the failed job; Actions has no
        # job-level retry setting.
        cache-save-if: ${{ inputs.cache-save == 'true' }}
