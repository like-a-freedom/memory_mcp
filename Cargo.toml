[package]
name = "memory_mcp"
version = "1.5.0"
edition = "2024"
resolver = "3"
license = "MIT"

[dependencies]
rmcp = { version = "2.2.0", features = ["macros", "transport-io", "server"] }
tokio = { version = "1.52.3", features = [
    "rt-multi-thread",
    "macros",
    "io-std",
    "sync",
    "time",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
schemars = "1.2.1"
chrono = { version = "0.4.45", features = ["serde", "clock"] }
thiserror = "2.0.18"
async-trait = "0.1.89"

anno = { version = "0.11.0", default-features = false }
regex = "1.12.4"
lopdf = "0.43.0"
roxmltree = "0.21.1"
sha2 = "0.11.0"
hex = "0.4.3"
serde_cbor = "0.11.2"
lru = "0.18.0"
surrealdb = { version = "3.2.0", features = ["kv-rocksdb", "kv-mem"] }
strsim = "0.11.1"
unicode-normalization = "0.1.25"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "rustls"
] }
candle-core = { git = "https://github.com/huggingface/candle.git", default-features = false }
candle-nn = { git = "https://github.com/huggingface/candle.git", default-features = false }
candle-transformers = { git = "https://github.com/huggingface/candle.git", default-features = false }
tokenizers = { version = "0.23.1", default-features = false, features = [
    "fancy-regex"
] }
hf-hub = { version = "0.5.0", default-features = false, features = ["tokio"] }
pulp = "0.22.3"
clap = { version = "4.6", features = ["derive", "env"] }
notify = { version = "8.2.0", optional = true }

[features]
default = []
cli-watch = ["notify"]
mcp-apps = []
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[dev-dependencies]
serde_json = "1.0.150"
tempfile = "3.27.0"
csv = "1.4.0"
mockall = "0.15.0"

[profile.dev]
opt-level = 0
debug = 1
incremental = true
codegen-units = 16

[profile.dev.package."*"]
opt-level = 3

[profile.test]
inherits = "dev"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
