[workspace]
members = ["crates/*"]
default-members = ["crates/memory-mcp"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "MIT"

[workspace.dependencies]
anno = { version = "0.11.0", default-features = false, features = ["onnx"] }
async-trait = "0.1.92"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
chrono = { version = "0.4.45", features = ["serde", "clock"] }
clap = { version = "4.6", features = ["derive", "env"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
csv = "1.4.0"
hex = "0.4.3"
hf-hub = { version = "1.0.0", default-features = false, features = ["rustls-tls"] }
indicatif = "0.18.6"
lopdf = "0.44.0"
lru = "0.18.2"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] }
mimalloc = "0.1"
mockall = "0.15.0"
notify = "8.2.0"
proptest = "1.11.0"
regex = "1.13.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.1.2", features = ["macros", "transport-io", "server"] }
roxmltree = "0.21.1"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
strsim = "0.11.1"
surrealdb = { version = "3.2.4", features = ["kv-rocksdb", "kv-mem"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "io-std",
    "sync",
    "time",
    "signal",
] }
tokio-util = { version = "0.7.19", features = ["rt"] }
unicode-normalization = "0.1.25"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unexpected_cfgs = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 0
debug = 1
incremental = true
codegen-units = 16

[profile.dev.package."*"]
opt-level = 3

[profile.test]
inherits = "dev"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
